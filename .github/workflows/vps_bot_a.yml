name: Continuous VPN Worker - Instance A

on:
  repository_dispatch:
    types: [trigger_a]
  workflow_dispatch:
    inputs:
      duration:
        description: "Minutes to run"
        default: "300"
      trigger:
        description: "Minute at which to start the other instance"
        default: "295"

permissions:
  contents: read

jobs:
  run-instance-a:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      INSTANCE: "A"
      OTHER_EVENT: "trigger_a2"
      DURATION: ${{ github.event.inputs.duration || '300' }}
      TRIGGER: ${{ github.event.inputs.trigger || '295' }}
      WD: ${{ github.workspace }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
      EXPECTED_EXIT_IP: ${{ secrets.EXPECTED_EXIT_IP }}
      PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
      VPN_CONFIG: ${{ secrets.VPN_CONFIG }}
      VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
      VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Job Info
        run: |
          echo "Instance:  $INSTANCE"
          echo "Other:     $OTHER_EVENT"
          echo "Duration:  $DURATION min, handoff at minute $TRIGGER"
          echo "Run id:    $GITHUB_RUN_ID"
          date -u
          ls -la receiver.py

      - name: Ensure DNS works
        run: |
          echo "---- current resolv.conf ----"
          cat /etc/resolv.conf || true
          echo "---- injecting public DNS ----"
          sudo sh -c 'printf "nameserver 8.8.8.8\nnameserver 1.1.1.1\nnameserver 9.9.9.9\n" > /etc/resolv.conf'
          echo "---- verify ----"
          getent hosts security.ubuntu.com || true
          getent hosts archive.ubuntu.com  || true
          getent hosts github.com          || true

      - name: Download cloudflared
        run: |
          curl -fsSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo install -m 755 cloudflared /usr/local/bin/cfd
          ./cloudflared --version

      - name: Validate secrets
        run: |
          missing=0
          for v in VPN_CONFIG VPN_USERNAME VPN_PASSWORD GH_TOKEN CF_TUNNEL_TOKEN; do
            if [ -z "${!v}" ]; then echo "MISSING secret: $v"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "all required secrets present"

      - name: Create helper scripts
        run: |
          cat > "$WD/startup_fail.sh" <<'EOF'
          #!/usr/bin/env bash
          echo "STARTUP FAILED: $*"
          exit 1
          EOF

          cat > "$WD/start_cf.sh" <<'EOF'
          #!/usr/bin/env bash
          set -u
          WD="${WD:-$PWD}"
          cd /tmp
          RAW="${CF_TUNNEL_TOKEN:-}"
          CLEAN=$(printf '%s' "$RAW" | tr -d '[:space:]"')
          case "$CLEAN" in
            *eyJ*) TOKEN="eyJ${CLEAN#*eyJ}" ;;
            *)     TOKEN="$CLEAN" ;;
          esac
          if [ -z "$TOKEN" ]; then echo "empty tunnel token"; exit 1; fi

          sudo pkill -f 'tunnel --no-autoupdate run' 2>/dev/null || true
          sleep 2
          : > "$WD/cloudflared.log"

          if [ "${CF_MODE:-plain}" = "isolated" ]; then
            nohup sudo -u cfuser env HOME=/tmp TUNNEL_TOKEN="$TOKEN" \
              TUNNEL_TRANSPORT_PROTOCOL=http2 \
              /usr/local/bin/cfd tunnel --no-autoupdate run \
              >> "$WD/cloudflared.log" 2>&1 &
          else
            nohup env TUNNEL_TOKEN="$TOKEN" TUNNEL_TRANSPORT_PROTOCOL=http2 \
              "$WD/cloudflared" tunnel --no-autoupdate run \
              >> "$WD/cloudflared.log" 2>&1 &
          fi

          for i in $(seq 1 60); do
            if grep -q "Registered tunnel connection" "$WD/cloudflared.log"; then
              echo "tunnel registered after ${i}s (mode=${CF_MODE:-plain})"
              exit 0
            fi
            sleep 1
          done
          echo "tunnel did NOT register within 60s; log tail:"
          tail -n 40 "$WD/cloudflared.log"
          exit 1
          EOF
          chmod +x "$WD/startup_fail.sh" "$WD/start_cf.sh"

      - name: Install OpenVPN
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq; then ok=1; break; fi
            echo "apt-get update failed, retry $i in 10s..."
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "apt-get update failed after 5 attempts"; exit 1; }
          sudo apt-get install -y -qq openvpn
          openvpn --version | head -n 1

      - name: Setup VPN credentials
        run: |
          printf '%s' "$VPN_CONFIG" > vpn.ovpn
          sed -i 's/\r$//' vpn.ovpn
          printf '%s\n%s\n' "$VPN_USERNAME" "$VPN_PASSWORD" > pass.txt
          chmod 600 pass.txt
          {
            echo ""
            echo "auth-user-pass $WD/pass.txt"
            echo "data-ciphers AES-128-CBC"
            echo "data-ciphers-fallback AES-128-CBC"
          } >> vpn.ovpn
          echo "vpn.ovpn written ($(wc -l < vpn.ovpn) lines)"

      - name: Check IP before VPN
        run: |
          echo "runner IP before VPN: $(curl -s --max-time 10 https://api.ipify.org)"
          read -r GW IF <<< "$(ip route show default | awk '/^default/ {for(i=1;i<=NF;i++){if($i=="via")g=$(i+1); if($i=="dev")d=$(i+1)}; print g" "d; exit}')"
          echo "original gateway: $GW dev $IF"
          echo "ORIG_GW=$GW" >> "$GITHUB_ENV"
          echo "ORIG_IF=$IF" >> "$GITHUB_ENV"

      - name: Start VPN
        run: |
          sudo pkill openvpn 2>/dev/null || true
          OK=0
          for attempt in $(seq 1 80); do
            sudo sh -c ': > vpn.log'
            sudo openvpn --config vpn.ovpn --daemon --log "$WD/vpn.log" --writepid /tmp/vpn.pid
            RESULT=wait
            for s in $(seq 1 25); do
              sleep 1
              if sudo grep -q "Initialization Sequence Completed" vpn.log; then RESULT=up; break; fi
              if sudo grep -qE "AUTH_FAILED|Exiting due to fatal error" vpn.log; then RESULT=fail; break; fi
            done
            if [ "$RESULT" = "up" ] && ip link show tun0 >/dev/null 2>&1; then
              OK=1
              echo "VPN up on attempt $attempt"
              break
            fi
            echo "attempt $attempt: $RESULT"
            sudo pkill openvpn 2>/dev/null || true
            sleep 8
          done
          [ "$OK" = 1 ] || bash "$WD/startup_fail.sh" "VPN did not connect after 80 attempts"

      - name: Verify VPN
        run: |
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --interface tun0 --max-time 8 \
              https://fapi.binance.com/fapi/v1/ping || true)
            [ "$code" = "200" ] && ok=$((ok+1))
          done
          echo "binance ping via tun0: $ok / 30 succeeded"
          [ "$ok" -ge 20 ] || bash "$WD/startup_fail.sh" "VPN unstable ($ok/30)"

      - name: Exit IP gate
        run: |
          IP=$(curl -s --interface tun0 --max-time 10 https://api.ipify.org || true)
          echo "VPN exit IP: $IP"
          [ -n "$IP" ] || bash "$WD/startup_fail.sh" "could not read exit IP"
          if [ -n "${EXPECTED_EXIT_IP:-}" ] && [ "$IP" != "$EXPECTED_EXIT_IP" ]; then
            bash "$WD/startup_fail.sh" "exit IP $IP is not the expected one"
          fi

      - name: Start Receiver
        run: |
          nohup python3 receiver.py > "$WD/receiver.log" 2>&1 &
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
              http://127.0.0.1:8081/fapi/v1/ping || true)
            if [ "$code" = "200" ]; then echo "receiver ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "receiver not ready"; tail -n 30 "$WD/receiver.log"
          exit 1

      - name: Latency diagnostic (temporary)
        continue-on-error: true
        run: |
          echo "---- VPN protocol and server ----"
          grep -E '^(remote|proto) ' vpn.ovpn || true
          echo "---- 4 calls on ONE connection, direct to Binance via tun0 ----"
          U=https://fapi.binance.com/fapi/v1/time
          curl -sS -o /dev/null -o /dev/null -o /dev/null -o /dev/null --interface tun0 --max-time 30 \
            -w "dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}\n" \
            $U $U $U $U || true
          echo "---- 8 calls through local receiver.py (pool report) ----"
          R=http://127.0.0.1:8081/fapi/v1/time
          for i in 1 2 3 4 5 6 7 8; do
            curl -sS -D /tmp/h.txt -o /dev/null --max-time 30 \
              -w "total=%{time_total} " $R || true
            grep -iE '^(x-pool|x-upstream-ms)' /tmp/h.txt | tr -d '\r' | tr '\n' ' '
            echo
          done
          echo "---- RTT through the VPN ----"
          ping -c 4 -W 3 -I tun0 1.1.1.1 || true

      - name: Route cloudflared outside VPN
        run: |
          CF_MODE=isolated
          if ! id cfuser >/dev/null 2>&1; then
            sudo useradd -r -s /usr/sbin/nologin cfuser || CF_MODE=plain
          fi
          if [ "$CF_MODE" = "isolated" ] && [ -n "${ORIG_GW:-}" ] && [ -n "${ORIG_IF:-}" ]; then
            CFUID=$(id -u cfuser)
            sudo ip route replace default via "$ORIG_GW" dev "$ORIG_IF" onlink table 100 || CF_MODE=plain
            sudo ip rule add uidrange "$CFUID-$CFUID" lookup 100 priority 100 || CF_MODE=plain
          else
            CF_MODE=plain
          fi
          echo "CF_MODE=$CF_MODE" >> "$GITHUB_ENV"
          echo "cloudflared mode: $CF_MODE"
          if [ "$CF_MODE" = "isolated" ]; then
            echo "cfuser egress IP: $(sudo -u cfuser curl -s --max-time 10 https://api.ipify.org || echo unknown)"
            echo "root   egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          else
            echo "WARNING: cloudflared will run inside the VPN path"
          fi

      - name: Start Cloudflare Named Tunnel
        run: |
          bash "$WD/start_cf.sh"

      - name: Run Task and Handoff Loop
        run: |
          set +e
          URL="${PUBLIC_URL:-https://fapi.astiagbiance.dpdns.org}"
          URL="${URL%/}"
          START=$(date +%s)
          DUR_S=$((DURATION * 60))
          TRIG_S=$((TRIGGER * 60))
          TRIGGERED=0
          LFAILS=0
          PFAILS=0

          trigger_other() {
            code=$(curl -s -o /tmp/disp.txt -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
              -d "{\"event_type\":\"$OTHER_EVENT\"}")
            echo "trigger $OTHER_EVENT -> HTTP $code"
            [ "$code" = "204" ]
          }

          restart_receiver() {
            pkill -f receiver.py 2>/dev/null
            sleep 1
            nohup python3 receiver.py >> "$WD/receiver.log" 2>&1 &
            sleep 3
          }

          restart_tunnel() {
            echo "restarting tunnel..."
            bash "$WD/start_cf.sh"
          }

          fail_over() {
            echo "FAIL-OVER: $1"
            [ "$TRIGGERED" = 1 ] || trigger_other
            exit 1
          }

          while true; do
            NOW=$(date +%s)
            EL=$((NOW - START))
            MIN=$((EL / 60))
            [ "$EL" -ge "$DUR_S" ] && break

            if [ "$TRIGGERED" = 0 ] && [ "$EL" -ge "$TRIG_S" ]; then
              trigger_other && TRIGGERED=1
            fi

            if ! ip link show tun0 >/dev/null 2>&1; then
              fail_over "tun0 disappeared"
            fi

            lcode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              http://127.0.0.1:8081/fapi/v1/ping)
            if [ "$lcode" = "200" ]; then
              LFAILS=0
            else
              LFAILS=$((LFAILS + 1))
              echo "min $MIN: local probe failed (code $lcode, $LFAILS in a row)"
              restart_receiver
              [ "$LFAILS" -ge 3 ] && fail_over "receiver not answering"
            fi

            if curl -s -D - -o /dev/null --max-time 15 "$URL/fapi/v1/ping" \
                 | tr -d '\r' | grep -qi '^x-via-receiver: 1'; then
              PFAILS=0
              pub=ok
            else
              PFAILS=$((PFAILS + 1))
              pub="FAIL($PFAILS)"
              if [ "$PFAILS" -ge 3 ]; then
                restart_tunnel
                PFAILS=0
              fi
            fi

            echo "min $MIN/$DURATION  tun0=up  local=$lcode  public=$pub  handoff_sent=$TRIGGERED"
            sleep 60
          done

          if [ "$TRIGGERED" = 0 ]; then
            echo "time is up and the other instance was never triggered; trying now"
            trigger_other
          fi
          echo "duration reached, exiting"

      - name: Debug on failure
        if: failure()
        run: |
          echo "---- ip route ----";  ip route || true
          echo "---- ip rule ----";   ip rule || true
          echo "---- resolv.conf ----"; cat /etc/resolv.conf || true
          echo "---- vpn.log ----";   sudo tail -n 40 vpn.log || true
          echo "---- receiver.log ----";    tail -n 40 receiver.log || true
          echo "---- cloudflared.log ----"; tail -n 40 cloudflared.log || true

      - name: Cleanup
        if: always()
        run: |
          sudo pkill -f 'tunnel --no-autoupdate run' 2>/dev/null || true
          pkill -f receiver.py 2>/dev/null || true
          sudo ip rule del priority 100 2>/dev/null || true
          sudo ip route flush table 100 2>/dev/null || true
          sudo pkill openvpn 2>/dev/null || true
          sleep 3
          rm -f pass.txt vpn.ovpn
          echo "cleanup done"
