name: Continuous VPN Worker - Instance A
on:
  repository_dispatch:
    types: [trigger_a]
  workflow_dispatch:
    inputs:
      duration:
        description: "Minutes to run"
        default: "60"
      trigger:
        description: "Minute at which to start the other instance"
        default: "50"
permissions:
  contents: read
jobs:
  run-instance-a:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      INSTANCE: "A"
      OTHER_EVENT: "trigger_a2"
      DURATION: ${{ github.event.inputs.duration || '120' }}
      TRIGGER: ${{ github.event.inputs.trigger || '110' }}
      WD: ${{ github.workspace }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
      EXPECTED_EXIT_IP: ${{ secrets.EXPECTED_EXIT_IP }}
      PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
      VPN_CONFIG: ${{ secrets.VPN_CONFIG }}
      VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
      VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap (DNS, packages, config, helper scripts)
        run: |
          set -e

          # ---- DNS -------------------------------------------------------
          sudo sh -c 'printf "nameserver 8.8.8.8\nnameserver 1.1.1.1\n" > /etc/resolv.conf'

          # ---- download cloudflared in parallel with apt ------------------
          curl -fsSL -o /tmp/cfd \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 &
          CFD_PID=$!

          for i in 1 2 3; do
            sudo apt-get update -qq && break
            echo "apt-get update failed, retry $i"; sleep 8
          done
          sudo apt-get install -y -qq --no-install-recommends openvpn netcat-openbsd

          wait "$CFD_PID"
          sudo install -m 755 /tmp/cfd /usr/local/bin/cfd
          cfd --version

          # ---- validate secrets --------------------------------------------
          missing=0
          for v in VPN_CONFIG VPN_USERNAME VPN_PASSWORD GH_TOKEN CF_TUNNEL_TOKEN; do
            [ -n "${!v}" ] || { echo "MISSING secret: $v"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          echo "all required secrets present"

          # ---- build vpn.ovpn ------------------------------------------------
          printf '%s' "$VPN_CONFIG" > vpn.ovpn
          sed -i 's/\r$//' vpn.ovpn

          # REAL FIX: force TCP + port 443 on every remote line AND every
          # standalone proto line, including the embedded proto field on
          # "remote HOST PORT proto" lines. A plain sed on the port number
          # alone left the trailing "udp" word untouched, so OpenVPN kept
          # silently connecting over UDP no matter what we did.
          awk '
            {
              if ($1 == "remote") {
                if (NF >= 3) $3 = "443"
                if (NF >= 4) $4 = "tcp"
                print
                next
              }
              if ($1 == "proto") { print "proto tcp"; next }
              print
            }
          ' vpn.ovpn > vpn.ovpn.tmp && mv vpn.ovpn.tmp vpn.ovpn

          # belt-and-suspenders: if no "proto" line exists at all, add one
          grep -q '^proto ' vpn.ovpn || sed -i '1i proto tcp' vpn.ovpn

          # strip directives we are about to redefine or that are UDP-only
          sed -i -E '/^explicit-exit-notify/d;/^auth-user-pass/d;/^auth-nocache/d' vpn.ovpn
          sed -i -E '/^data-ciphers(-fallback)?\b/d' vpn.ovpn
          sed -i -E '/^(hand-window|tls-timeout|server-poll-timeout|connect-retry|resolv-retry|fast-io|sndbuf|rcvbuf|mssfix|tun-mtu)\b/d' vpn.ovpn

          printf '%s\n%s\n' "$VPN_USERNAME" "$VPN_PASSWORD" > pass.txt
          chmod 600 pass.txt

          cat >> vpn.ovpn <<CFG
          auth-user-pass $WD/pass.txt
          auth-nocache
          data-ciphers AES-128-CBC
          data-ciphers-fallback AES-128-CBC
          hand-window 130
          tls-timeout 130
          server-poll-timeout 20
          connect-retry 2 5
          resolv-retry infinite
          fast-io
          sndbuf 524288
          rcvbuf 524288
          mssfix 1400
          tun-mtu 1400
          CFG

          echo "---- FINAL proto/remote lines (must show tcp everywhere) ----"
          grep -E '^(remote|proto)\b' vpn.ovpn

          # Hard safety gate: refuse to even try if any UDP profile survived
          if grep -E '^(remote|proto)\b' vpn.ovpn | grep -qi udp; then
            echo "FATAL: config still contains a UDP profile — aborting before wasting attempts"
            exit 1
          fi

          # Fast syntax/crypto sanity check (fails in ~1s instead of 140s)
          if ! openvpn --config vpn.ovpn --test-crypto 2>/tmp/ovpn_test.log; then
            if grep -qiE 'error|cannot|unrecognized|unknown option' /tmp/ovpn_test.log; then
              echo "vpn.ovpn has a fatal config error:"
              cat /tmp/ovpn_test.log
              exit 1
            fi
          fi

          # ---- remember the real default gateway (for cloudflared bypass) --
          read -r GW IF <<< "$(ip route show default | awk '/^default/{for(i=1;i<=NF;i++){if($i=="via")g=$(i+1);if($i=="dev")d=$(i+1)};print g" "d;exit}')"
          echo "ORIG_GW=$GW" >> "$GITHUB_ENV"
          echo "ORIG_IF=$IF" >> "$GITHUB_ENV"
          echo "runner IP: $(curl -s --max-time 6 https://api.ipify.org) | gw=$GW dev=$IF"

          # ---- helper: start_cf.sh (idempotent cloudflared launcher) -------
          cat > "$WD/start_cf.sh" <<'CFEOF'
          #!/usr/bin/env bash
          set -u
          WD="${WD:-$PWD}"
          RAW="${CF_TUNNEL_TOKEN:-}"
          CLEAN=$(printf '%s' "$RAW" | tr -d '[:space:]"')
          case "$CLEAN" in
            *eyJ*) TOKEN="eyJ${CLEAN#*eyJ}" ;;
            *)     TOKEN="$CLEAN" ;;
          esac
          [ -n "$TOKEN" ] || { echo "empty tunnel token"; exit 1; }

          sudo pkill -f 'tunnel --no-autoupdate run' 2>/dev/null || true
          sleep 1
          : > "$WD/cloudflared.log"

          if [ "${CF_MODE:-plain}" = "isolated" ]; then
            nohup sudo -u cfuser env HOME=/tmp TUNNEL_TOKEN="$TOKEN" \
              TUNNEL_TRANSPORT_PROTOCOL=http2 \
              /usr/local/bin/cfd tunnel --no-autoupdate run \
              >> "$WD/cloudflared.log" 2>&1 &
          else
            nohup env TUNNEL_TOKEN="$TOKEN" TUNNEL_TRANSPORT_PROTOCOL=http2 \
              /usr/local/bin/cfd tunnel --no-autoupdate run \
              >> "$WD/cloudflared.log" 2>&1 &
          fi

          for i in $(seq 1 300); do
            if grep -q "Registered tunnel connection" "$WD/cloudflared.log" 2>/dev/null; then
              echo "tunnel up after ~$((i * 2))00ms"
              exit 0
            fi
            sleep 0.2
          done

          echo "tunnel did NOT register within 60s; log tail:"
          tail -n 30 "$WD/cloudflared.log"
          exit 1
          CFEOF
          chmod +x "$WD/start_cf.sh"

          echo "bootstrap complete"

      - name: Start VPN
        run: |
          sudo pkill openvpn 2>/dev/null || true
          sleep 1
          OK=0

          for attempt in $(seq 1 40); do
            sudo sh -c ': > vpn.log'
            sudo openvpn \
              --config vpn.ovpn \
              --verb 4 \
              --daemon \
              --log "$WD/vpn.log" \
              --writepid /tmp/vpn.pid

            RESULT=wait
            PUSH_COUNT=0

            # poll every 200ms, up to 140s (700 ticks)
            for tick in $(seq 1 700); do
              sleep 0.2

              if sudo grep -q "Initialization Sequence Completed" "$WD/vpn.log" 2>/dev/null; then
                RESULT=up
                break
              fi

              if sudo grep -qE \
                "AUTH_FAILED|Exiting due to fatal error|Connection refused|SIGTERM|TLS Error|tls-crypt|Options error" \
                "$WD/vpn.log" 2>/dev/null; then
                RESULT=fail
                break
              fi

              if [ $((tick % 5)) -eq 0 ]; then
                # FIXED: grep -c prints "0" but exits status 1 on zero matches.
                # The old "|| echo 0" ran in ADDITION, producing a 2-line
                # value that broke the [ -ge ] integer test. Use parameter
                # expansion + a digit-only guard instead.
                PUSH_COUNT=$(sudo grep -c "PUSH_REQUEST" "$WD/vpn.log" 2>/dev/null)
                PUSH_COUNT=${PUSH_COUNT:-0}
                case "$PUSH_COUNT" in ''|*[!0-9]*) PUSH_COUNT=0 ;; esac
                [ "$PUSH_COUNT" -ge 5 ] 2>/dev/null && { RESULT=push_stuck; break; }
              fi
            done

            if [ "$RESULT" = "up" ] && ip link show tun0 >/dev/null 2>&1; then
              OK=1
              echo "VPN up on attempt $attempt"
              break
            fi

            echo ""
            echo "==== attempt $attempt: $RESULT (push_count=$PUSH_COUNT) ===="
            sudo tail -n 60 "$WD/vpn.log" || true
            echo "=============================================================="

            sudo pkill openvpn 2>/dev/null || true
            sleep 2

            case "$RESULT" in
              push_stuck)
                [ $((attempt % 5)) -eq 0 ] && { echo "cooling down 90s..."; sleep 90; } || sleep 8
                ;;
              wait)
                [ $((attempt % 5)) -eq 0 ] && { echo "cooling down 60s..."; sleep 60; } || sleep 4
                ;;
              *)
                sleep 8
                ;;
            esac
          done

          [ "$OK" = 1 ] || { echo "STARTUP FAILED: VPN did not connect after 40 attempts"; exit 1; }

      - name: Verify VPN + Start services
        run: |
          # ---- VPN stability check ------------------------------------------
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              --interface tun0 --max-time 5 \
              https://fapi.binance.com/fapi/v1/ping || true)
            [ "$code" = "200" ] && ok=$((ok+1))
          done
          echo "binance via tun0: $ok/30"
          [ "$ok" -ge 20 ] || { echo "STARTUP FAILED: VPN unstable ($ok/30)"; exit 1; }

          # ---- exit IP gate ---------------------------------------------------
          IP=$(curl -s --interface tun0 --max-time 8 https://api.ipify.org || true)
          echo "VPN exit IP: $IP"
          [ -n "$IP" ] || { echo "STARTUP FAILED: could not read exit IP"; exit 1; }
          if [ -n "${EXPECTED_EXIT_IP:-}" ] && [ "$IP" != "$EXPECTED_EXIT_IP" ]; then
            echo "STARTUP FAILED: exit IP $IP != expected $EXPECTED_EXIT_IP"; exit 1
          fi

          # ---- receiver --------------------------------------------------------
          nohup python3 receiver.py > "$WD/receiver.log" 2>&1 &
          code=""
          for i in $(seq 1 60); do
            sleep 0.3
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
              http://127.0.0.1:8081/fapi/v1/ping || true)
            [ "$code" = "200" ] && { echo "receiver up after ~$(awk "BEGIN{printf \"%.1f\", $i*0.3}")s"; break; }
          done
          [ "$code" = "200" ] || { echo "receiver not ready"; tail -n 30 "$WD/receiver.log"; exit 1; }

          # ---- route cloudflared outside the VPN --------------------------------
          CF_MODE=isolated
          if ! id cfuser >/dev/null 2>&1; then
            sudo useradd -r -s /usr/sbin/nologin cfuser || CF_MODE=plain
          fi
          if [ "$CF_MODE" = "isolated" ] && [ -n "${ORIG_GW:-}" ] && [ -n "${ORIG_IF:-}" ]; then
            CFUID=$(id -u cfuser)
            sudo ip route replace default via "$ORIG_GW" dev "$ORIG_IF" onlink table 100 || CF_MODE=plain
            sudo ip rule add uidrange "$CFUID-$CFUID" lookup 100 priority 100           || CF_MODE=plain
          else
            CF_MODE=plain
          fi
          echo "CF_MODE=$CF_MODE" >> "$GITHUB_ENV"
          echo "cloudflared mode: $CF_MODE"
          if [ "$CF_MODE" = "isolated" ]; then
            echo "cfuser egress IP: $(sudo -u cfuser curl -s --max-time 8 https://api.ipify.org || echo unknown)"
          else
            echo "WARNING: cloudflared will run inside the VPN path"
          fi

          bash "$WD/start_cf.sh"

      - name: Run Task and Handoff Loop
        run: |
          set +e
          URL="${PUBLIC_URL:-https://fapi.astiagbiance.dpdns.org}"
          URL="${URL%/}"
          START=$(date +%s)
          DUR_S=$((DURATION * 60))
          TRIG_S=$((TRIGGER * 60))
          TRIGGERED=0
          LFAILS=0
          PFAILS=0

          trigger_other() {
            code=$(curl -s -o /tmp/disp.txt -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
              -d "{\"event_type\":\"$OTHER_EVENT\"}")
            echo "trigger $OTHER_EVENT -> HTTP $code"
            [ "$code" = "204" ]
          }

          restart_receiver() {
            pkill -f receiver.py 2>/dev/null
            sleep 1
            nohup python3 receiver.py >> "$WD/receiver.log" 2>&1 &
            sleep 2
          }

          fail_over() {
            echo "FAIL-OVER: $1"
            [ "$TRIGGERED" = 1 ] || trigger_other
            exit 1
          }

          while true; do
            NOW=$(date +%s)
            EL=$((NOW - START))
            MIN=$((EL / 60))
            [ "$EL" -ge "$DUR_S" ] && break

            if [ "$TRIGGERED" = 0 ] && [ "$EL" -ge "$TRIG_S" ]; then
              trigger_other && TRIGGERED=1
            fi

            ip link show tun0 >/dev/null 2>&1 || fail_over "tun0 disappeared"

            lcode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 6 \
              http://127.0.0.1:8081/fapi/v1/ping)
            if [ "$lcode" = "200" ]; then
              LFAILS=0
            else
              LFAILS=$((LFAILS + 1))
              echo "min $MIN: local probe failed (code $lcode, $LFAILS in a row)"
              restart_receiver
              [ "$LFAILS" -ge 3 ] && fail_over "receiver not answering"
            fi

            if curl -s -D - -o /dev/null --max-time 10 "$URL/fapi/v1/ping" \
                 | tr -d '\r' | grep -qi '^x-via-receiver: 1'; then
              PFAILS=0
              pub=ok
            else
              PFAILS=$((PFAILS + 1))
              pub="FAIL($PFAILS)"
              if [ "$PFAILS" -ge 3 ]; then
                echo "restarting tunnel..."
                bash "$WD/start_cf.sh"
                PFAILS=0
              fi
            fi

            echo "min $MIN/$DURATION  tun0=up  local=$lcode  public=$pub  handoff_sent=$TRIGGERED"
            sleep 55
          done

          if [ "$TRIGGERED" = 0 ]; then
            echo "time is up and the other instance was never triggered; trying now"
            trigger_other
          fi
          echo "duration reached, exiting"

      - name: Debug on failure
        if: failure()
        run: |
          echo "---- ip route ----";        ip route             || true
          echo "---- ip rule ----";         ip rule              || true
          echo "---- resolv.conf ----";     cat /etc/resolv.conf || true
          echo "---- vpn.log ----";         sudo cat vpn.log     || true
          echo "---- receiver.log ----";    tail -n 40 receiver.log    || true
          echo "---- cloudflared.log ----"; tail -n 40 cloudflared.log || true

      - name: Cleanup
        if: always()
        run: |
          sudo pkill -f 'tunnel --no-autoupdate run' 2>/dev/null || true
          pkill -f receiver.py             2>/dev/null || true
          sudo ip rule  del priority 100   2>/dev/null || true
          sudo ip route flush table 100    2>/dev/null || true
          sudo pkill openvpn               2>/dev/null || true
          sleep 2
          rm -f pass.txt vpn.ovpn
          echo "cleanup done"
