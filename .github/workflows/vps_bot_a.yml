name: Continuous VPN Worker - Instance A

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Total runtime in minutes"
        required: false
        default: "60"
        type: string
      trigger:
        description: "Minute to send the trigger_a2 handoff"
        required: false
        default: "50"
        type: string
  repository_dispatch:
    types: [trigger_a1]

permissions:
  contents: read

jobs:
  vpn-worker:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      DURATION: ${{ github.event.inputs.duration || '120' }}
      TRIGGER: ${{ github.event.inputs.trigger || '110' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap
        shell: bash
        env:
          VPN_CONFIG: ${{ secrets.VPN_CONFIG }}
          VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          set -Eeuo pipefail

          WD="$GITHUB_WORKSPACE"
          umask 077

          : "${VPN_CONFIG:?Missing VPN_CONFIG secret}"
          : "${VPN_USERNAME:?Missing VPN_USERNAME secret}"
          : "${VPN_PASSWORD:?Missing VPN_PASSWORD secret}"
          : "${CF_TUNNEL_TOKEN:?Missing CF_TUNNEL_TOKEN secret}"

          if [[ ! -f "$WD/receiver.py" ]]; then
            echo "::error::receiver.py must exist in the repository root."
            exit 1
          fi

          # Download cloudflared while apt installs the other dependencies.
          curl -fsSL --retry 3 --retry-delay 1 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o "$WD/cloudflared" &
          CF_DOWNLOAD_PID=$!

          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            openvpn curl iproute2 ca-certificates python3 python3-requests

          wait "$CF_DOWNLOAD_PID"
          chmod 755 "$WD/cloudflared"

          echo "OpenVPN version:"
          openvpn --version | head -n 1
          echo "cloudflared version:"
          "$WD/cloudflared" --version

          # Save the provider profile. Do not rewrite its remote host, port,
          # or protocol: those values must match the provider's working profile.
          printf '%s\n' "$VPN_CONFIG" | sed 's/\r$//' > "$WD/vpn.ovpn"
          printf '%s\n%s\n' "$VPN_USERNAME" "$VPN_PASSWORD" > "$WD/pass.txt"

          # Replace only the credential-file path and process-management options.
          sed -i -E \
            -e '/^[[:space:]]*auth-user-pass([[:space:]].*)?$/d' \
            -e '/^[[:space:]]*(daemon|log|log-append|writepid)([[:space:]].*)?$/d' \
            "$WD/vpn.ovpn"

          printf '\nauth-user-pass "%s"\n' "$WD/pass.txt" >> "$WD/vpn.ovpn"
          chmod 600 "$WD/vpn.ovpn" "$WD/pass.txt"

          echo "Provider remote/proto directives (left unchanged):"
          grep -Ei '^[[:space:]]*(remote|proto)[[:space:]]' "$WD/vpn.ovpn" || true

          # Keep the original runner route for cloudflared's dedicated user.
          DEFAULT_ROUTE="$(ip -4 route show default | head -n 1)"
          ORIG_GW="$(awk '{for (i=1; i<=NF; i++) if ($i=="via") {print $(i+1); exit}}' <<< "$DEFAULT_ROUTE")"
          ORIG_IF="$(awk '{for (i=1; i<=NF; i++) if ($i=="dev") {print $(i+1); exit}}' <<< "$DEFAULT_ROUTE")"

          if [[ -z "$ORIG_GW" || -z "$ORIG_IF" ]]; then
            echo "::error::Could not read the runner's original IPv4 default route."
            echo "$DEFAULT_ROUTE"
            exit 1
          fi

          if ! id -u cfuser >/dev/null 2>&1; then
            sudo useradd --system --no-create-home \
              --home-dir /nonexistent \
              --shell /usr/sbin/nologin \
              cfuser
          fi

          CF_UID="$(id -u cfuser)"

          # Accept either a raw tunnel token or a copied command containing --token.
          TOKEN="$CF_TUNNEL_TOKEN"
          if [[ "$TOKEN" =~ --token=([^[:space:]]+) ]]; then
            TOKEN="${BASH_REMATCH[1]}"
          elif [[ "$TOKEN" =~ --token[[:space:]]+([^[:space:]]+) ]]; then
            TOKEN="${BASH_REMATCH[1]}"
          fi

          TOKEN="${TOKEN//$'\r'/}"
          TOKEN="${TOKEN//$'\n'/}"
          TOKEN="${TOKEN#\"}"
          TOKEN="${TOKEN%\"}"
          TOKEN="${TOKEN#\'}"
          TOKEN="${TOKEN%\'}"

          if [[ -z "$TOKEN" ]]; then
            echo "::error::Could not extract a Cloudflare tunnel token."
            exit 1
          fi

          printf '%s\n' "$TOKEN" > "$WD/cf-token.txt"
          sudo chown cfuser:cfuser "$WD/cf-token.txt"
          sudo chmod 600 "$WD/cf-token.txt"

          : > "$WD/receiver.log"

          {
            echo "ORIG_GW=$ORIG_GW"
            echo "ORIG_IF=$ORIG_IF"
            echo "CF_UID=$CF_UID"
          } >> "$GITHUB_ENV"

          cat > "$WD/start_receiver.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          WD="${GITHUB_WORKSPACE:?}"
          PIDFILE="$WD/receiver.pid"

          if [[ -s "$PIDFILE" ]]; then
            OLD_PID="$(cat "$PIDFILE" 2>/dev/null || true)"
            if [[ "$OLD_PID" =~ ^[0-9]+$ ]]; then
              OLD_CMD="$(ps -p "$OLD_PID" -o args= 2>/dev/null || true)"
              if [[ "$OLD_CMD" == *"$WD/receiver.py"* ]]; then
                kill -TERM "$OLD_PID" 2>/dev/null || true
                for _ in {1..20}; do
                  if ! kill -0 "$OLD_PID" 2>/dev/null; then
                    break
                  fi
                  sleep 0.1
                done
                kill -KILL "$OLD_PID" 2>/dev/null || true
              fi
            fi
          fi

          rm -f "$PIDFILE"
          touch "$WD/receiver.log"

          nohup env PORT=8081 python3 "$WD/receiver.py" \
            >> "$WD/receiver.log" 2>&1 </dev/null &
          echo "$!" > "$PIDFILE"
          SCRIPT

          cat > "$WD/start_cf.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          WD="${GITHUB_WORKSPACE:?}"
          CF_BIN="$WD/cloudflared"
          TOKEN_FILE="$WD/cf-token.txt"
          LOG="$WD/cloudflared.log"

          [[ -x "$CF_BIN" ]] || {
            echo "::error::cloudflared binary is missing."
            exit 1
          }
          [[ -r "$TOKEN_FILE" ]] || {
            echo "::error::Cloudflare token file is missing."
            exit 1
          }

          sudo pkill -TERM -u cfuser -x cloudflared 2>/dev/null || true
          sleep 0.2

          sudo install -o cfuser -g cfuser -m 600 /dev/null "$LOG"

          sudo -u cfuser -- nohup "$CF_BIN" \
            tunnel \
            --no-autoupdate \
            --loglevel info \
            --logfile "$LOG" \
            run \
            --token-file "$TOKEN_FILE" \
            </dev/null >/dev/null 2>&1 &

          CF_UID="$(id -u cfuser)"

          for ((tick = 0; tick < 300; tick++)); do
            if sudo grep -Fq "Registered tunnel connection" "$LOG" 2>/dev/null; then
              echo "Cloudflare tunnel registered."
              exit 0
            fi

            if ! sudo pgrep -u "$CF_UID" -x cloudflared >/dev/null 2>&1; then
              break
            fi

            sleep 0.2
          done

          echo "::error::cloudflared did not register a tunnel connection."
          sudo cat "$LOG" 2>/dev/null || true
          exit 1
          SCRIPT

          cat > "$WD/check_public.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          if [[ $# -ne 1 ]]; then
            exit 2
          fi

          MAX_TIME="${PUBLIC_CHECK_TIMEOUT:-8}"

          RESPONSE="$(
            sudo -u cfuser -- curl \
              --silent \
              --show-error \
              --location \
              --max-redirs 3 \
              --connect-timeout 3 \
              --max-time "$MAX_TIME" \
              --dump-header - \
              --output /dev/null \
              --write-out $'\nHTTP_CODE:%{http_code}' \
              "$1" 2>/dev/null || true
          )"

          CLEAN_RESPONSE="$(printf '%s\n' "$RESPONSE" | tr -d '\r')"

          if grep -Eiq '^x-via-receiver:[[:space:]]*1$' <<< "$CLEAN_RESPONSE" &&
             grep -q '^HTTP_CODE:200$' <<< "$CLEAN_RESPONSE"; then
            exit 0
          fi

          exit 1
          SCRIPT

          chmod 700 \
            "$WD/start_receiver.sh" \
            "$WD/start_cf.sh" \
            "$WD/check_public.sh"

      - name: Connect OpenVPN once
        shell: bash
        run: |
          set -Eeuo pipefail

          WD="$GITHUB_WORKSPACE"
          sudo rm -f "$WD/vpn.log" "$WD/openvpn.pid"

          fail_vpn() {
            echo "::error::$1"
            if [[ -f "$WD/vpn.log" ]]; then
              echo "===== Full OpenVPN log ====="
              sudo cat "$WD/vpn.log" || true
            fi

            if [[ -s "$WD/openvpn.pid" ]]; then
              VPN_PID="$(sudo cat "$WD/openvpn.pid" 2>/dev/null || true)"
              if [[ "$VPN_PID" =~ ^[0-9]+$ ]]; then
                sudo kill -TERM "$VPN_PID" 2>/dev/null || true
              fi
            fi
            sudo pkill -TERM -x openvpn 2>/dev/null || true
            exit 1
          }

          # One OpenVPN launch; no outer retry loop.
          # TLS failure exits instead of silently restarting the same handshake.
          if ! sudo openvpn \
            --config "$WD/vpn.ovpn" \
            --connect-retry 1 1 \
            --connect-retry-max 1 \
            --resolv-retry 5 \
            --server-poll-timeout 15 \
            --hand-window 20 \
            --tls-exit \
            --writepid "$WD/openvpn.pid" \
            --log "$WD/vpn.log" \
            --verb 4 \
            --daemon; then
            fail_vpn "OpenVPN failed to start."
          fi

          # 150 × 200 ms = 30 seconds maximum for this one launch.
          for ((tick = 0; tick < 150; tick++)); do
            if sudo grep -Fq \
              "Initialization Sequence Completed" "$WD/vpn.log" 2>/dev/null; then
              echo "OpenVPN connected."
              exit 0
            fi

            if sudo grep -Eiq \
              'AUTH_FAILED|Options error|VERIFY ERROR|Exiting due to fatal error|TLS Error|Cannot resolve host address|Connection refused|Network is unreachable' \
              "$WD/vpn.log" 2>/dev/null; then
              fail_vpn "OpenVPN reported a connection or configuration error."
            fi

            if [[ -s "$WD/openvpn.pid" ]]; then
              VPN_PID="$(sudo cat "$WD/openvpn.pid" 2>/dev/null || true)"
              if [[ "$VPN_PID" =~ ^[0-9]+$ ]] &&
                 ! sudo kill -0 "$VPN_PID" 2>/dev/null; then
                fail_vpn "OpenVPN exited before the tunnel came up."
              fi
            fi

            sleep 0.2
          done

          fail_vpn "OpenVPN did not connect within 30 seconds."

      - name: Verify VPN and start services
        shell: bash
        env:
          EXPECTED_EXIT_IP: ${{ secrets.EXPECTED_EXIT_IP }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -Eeuo pipefail

          WD="$GITHUB_WORKSPACE"

          VPN_IF="$(
            ip -o link show |
              awk -F': ' '$2 ~ /^tun[0-9]*(@.*)?$/ {sub(/@.*/, "", $2); print $2; exit}'
          )"

          if [[ -z "$VPN_IF" ]]; then
            echo "::error::OpenVPN reported success, but no tun interface exists."
            ip -o link show
            exit 1
          fi

          echo "VPN interface: $VPN_IF"
          echo "VPN_IF=$VPN_IF" >> "$GITHUB_ENV"

          VPN_EXIT_IP="$(
            curl --silent --show-error --fail \
              --interface "$VPN_IF" \
              --connect-timeout 3 \
              --max-time 8 \
              https://api.ipify.org 2>/dev/null || true
          )"

          if [[ -z "$VPN_EXIT_IP" ]]; then
            echo "::error::Could not read the VPN exit IP through $VPN_IF."
            exit 1
          fi

          echo "VPN exit IP: $VPN_EXIT_IP"

          if [[ -n "${EXPECTED_EXIT_IP:-}" &&
                "$VPN_EXIT_IP" != "$EXPECTED_EXIT_IP" ]]; then
            echo "::error::VPN exit IP did not match EXPECTED_EXIT_IP."
            exit 1
          fi

          BINANCE_OK=0
          BINANCE_TRIES=30

          for ((i = 1; i <= BINANCE_TRIES; i++)); do
            if curl --silent --show-error --fail \
              --interface "$VPN_IF" \
              --connect-timeout 1 \
              --max-time 2 \
              --output /dev/null \
              https://fapi.binance.com/fapi/v1/ping 2>/dev/null; then
              BINANCE_OK=$((BINANCE_OK + 1))
            fi

            if (( BINANCE_OK >= 20 )); then
              break
            fi

            if (( BINANCE_OK + BINANCE_TRIES - i < 20 )); then
              break
            fi

            sleep 0.2
          done

          echo "Binance Futures ping successes: $BINANCE_OK/$BINANCE_TRIES"

          if (( BINANCE_OK < 20 )); then
            echo "::error::VPN is up, but Binance Futures connectivity did not pass."
            exit 1
          fi

          bash "$WD/start_receiver.sh"

          RECEIVER_READY=0
          for ((tick = 0; tick < 60; tick++)); do
            if curl --silent --show-error --fail \
              --connect-timeout 1 \
              --max-time 2 \
              --output /dev/null \
              http://127.0.0.1:8081/fapi/v1/ping 2>/dev/null; then
              RECEIVER_READY=1
              break
            fi
            sleep 0.2
          done

          if (( RECEIVER_READY == 0 )); then
            echo "::error::receiver.py did not become ready on port 8081."
            cat "$WD/receiver.log" || true
            exit 1
          fi

          : "${ORIG_GW:?Missing original runner gateway}"
          : "${ORIG_IF:?Missing original runner interface}"
          : "${CF_UID:?Missing cfuser UID}"

          # Route cloudflared's dedicated user outside the VPN.
          sudo ip route replace default \
            via "$ORIG_GW" \
            dev "$ORIG_IF" \
            table 100

          sudo ip rule add \
            priority 100 \
            uidrange "$CF_UID-$CF_UID" \
            table 100

          echo "Cloudflare policy route:"
          sudo ip rule show
          sudo ip route show table 100

          PUBLIC_URL="${PUBLIC_URL:-https://fapi.astiagbiance.dpdns.org}"

          case "$PUBLIC_URL" in
            https://*|http://*) ;;
            *)
              echo "::error::PUBLIC_URL must begin with http:// or https://."
              exit 1
              ;;
          esac

          PUBLIC_PING_URL="${PUBLIC_URL%/}/fapi/v1/ping"
          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"

          bash "$WD/start_cf.sh"

          PUBLIC_READY=0
          for ((tick = 0; tick < 30; tick++)); do
            if PUBLIC_CHECK_TIMEOUT=2 \
              bash "$WD/check_public.sh" "$PUBLIC_PING_URL"; then
              PUBLIC_READY=1
              break
            fi
            sleep 0.2
          done

          if (( PUBLIC_READY == 0 )); then
            echo "::error::Public endpoint did not return x-via-receiver: 1."
            sudo cat "$WD/cloudflared.log" 2>/dev/null || true
            exit 1
          fi

          echo "VPN, receiver, and public tunnel are ready."

      - name: Run task and handoff loop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -Eeuo pipefail

          WD="$GITHUB_WORKSPACE"
          DURATION="${DURATION:-120}"
          TRIGGER="${TRIGGER:-110}"
          PUBLIC_URL="${PUBLIC_URL:-https://fapi.astiagbiance.dpdns.org}"

          : "${GH_TOKEN:?Missing GH_TOKEN secret; it is needed for repository_dispatch}"
          : "${VPN_IF:?Missing VPN interface name}"

          if [[ ! "$DURATION" =~ ^[0-9]+$ ]]; then
            echo "::error::DURATION must be an integer number of minutes."
            exit 1
          fi

          if [[ ! "$TRIGGER" =~ ^[0-9]+$ ]]; then
            echo "::error::TRIGGER must be an integer number of minutes."
            exit 1
          fi

          DURATION=$((10#$DURATION))
          TRIGGER=$((10#$TRIGGER))

          if (( DURATION < 1 || DURATION > 350 )); then
            echo "::error::DURATION must be between 1 and 350 minutes."
            exit 1
          fi

          if (( TRIGGER < 0 )); then
            echo "::error::TRIGGER cannot be negative."
            exit 1
          fi

          TOTAL_SECONDS=$((DURATION * 60))
          TRIGGER_SECONDS=$((TRIGGER * 60))
          PUBLIC_PING_URL="${PUBLIC_URL%/}/fapi/v1/ping"

          HANDOFF_SENT=0
          RECEIVER_FAILURES=0
          TUNNEL_FAILURES=0
          ELAPSED=0

          send_handoff() {
            if (( HANDOFF_SENT == 1 )); then
              return 0
            fi

            echo "Dispatching trigger_a2 to $GITHUB_REPOSITORY."

            if ! curl --silent --show-error --fail \
              --max-time 20 \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
              --data '{"event_type":"trigger_a2"}'; then
              echo "::error::repository_dispatch trigger_a2 failed."
              return 1
            fi

            HANDOFF_SENT=1
            echo "Handoff dispatched."
          }

          failover() {
            echo "::error::Failover: $1"
            if (( HANDOFF_SENT == 0 )); then
              send_handoff || true
            fi
            exit 1
          }

          if (( TRIGGER_SECONDS == 0 )); then
            send_handoff
          fi

          while (( ELAPSED < TOTAL_SECONDS )); do
            REMAINING=$((TOTAL_SECONDS - ELAPSED))
            SLEEP_FOR=55

            if (( REMAINING < SLEEP_FOR )); then
              SLEEP_FOR=$REMAINING
            fi

            sleep "$SLEEP_FOR"
            ELAPSED=$((ELAPSED + SLEEP_FOR))

            echo "Runtime: ${ELAPSED}s / ${TOTAL_SECONDS}s"

            if (( HANDOFF_SENT == 0 && ELAPSED >= TRIGGER_SECONDS )); then
              send_handoff
            fi

            if ! ip link show "$VPN_IF" >/dev/null 2>&1; then
              failover "VPN interface $VPN_IF disappeared."
            fi

            VPN_PID="$(sudo cat "$WD/openvpn.pid" 2>/dev/null || true)"
            if [[ ! "$VPN_PID" =~ ^[0-9]+$ ]] ||
               ! sudo kill -0 "$VPN_PID" 2>/dev/null; then
              failover "OpenVPN process is no longer running."
            fi

            if curl --silent --show-error --fail \
              --connect-timeout 1 \
              --max-time 2 \
              --output /dev/null \
              http://127.0.0.1:8081/fapi/v1/ping 2>/dev/null; then
              RECEIVER_FAILURES=0
            else
              RECEIVER_FAILURES=$((RECEIVER_FAILURES + 1))
              echo "Receiver health failure $RECEIVER_FAILURES/3; restarting receiver."

              if (( RECEIVER_FAILURES >= 3 )); then
                failover "Receiver failed three consecutive health checks."
              fi

              if ! bash "$WD/start_receiver.sh"; then
                failover "Could not restart receiver.py."
              fi
            fi

            if PUBLIC_CHECK_TIMEOUT=8 \
              bash "$WD/check_public.sh" "$PUBLIC_PING_URL"; then
              TUNNEL_FAILURES=0
            else
              TUNNEL_FAILURES=$((TUNNEL_FAILURES + 1))
              echo "Public tunnel health failure $TUNNEL_FAILURES/3."

              if (( TUNNEL_FAILURES >= 3 )); then
                echo "Restarting cloudflared tunnel."
                if ! bash "$WD/start_cf.sh"; then
                  failover "Cloudflare tunnel could not be restarted."
                fi
                TUNNEL_FAILURES=0
              fi
            fi
          done

          if (( HANDOFF_SENT == 0 )); then
            echo "Runtime ended before the configured trigger minute; dispatching handoff now."
            send_handoff
          fi

          echo "Run completed."

      - name: Debug on failure
        if: failure()
        shell: bash
        run: |
          set +e

          WD="$GITHUB_WORKSPACE"

          echo "===== IPv4 routes ====="
          sudo ip -4 route show table all

          echo "===== IPv6 routes ====="
          sudo ip -6 route show table all

          echo "===== Policy rules ====="
          sudo ip rule show

          echo "===== Resolver configuration ====="
          cat /etc/resolv.conf

          echo "===== Processes ====="
          ps auxww | grep -E '[o]penvpn|[r]eceiver.py|[c]loudflared' || true

          for LOG in vpn.log receiver.log cloudflared.log; do
            if [[ -f "$WD/$LOG" ]]; then
              echo "===== Full $LOG ====="
              sudo cat "$WD/$LOG" || true
            fi
          done

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          WD="$GITHUB_WORKSPACE"

          if [[ -s "$WD/openvpn.pid" ]]; then
            VPN_PID="$(sudo cat "$WD/openvpn.pid" 2>/dev/null)"
            if [[ "$VPN_PID" =~ ^[0-9]+$ ]]; then
              sudo kill -TERM "$VPN_PID" 2>/dev/null
            fi
          fi
          sudo pkill -TERM -x openvpn 2>/dev/null

          if [[ -s "$WD/receiver.pid" ]]; then
            RECEIVER_PID="$(cat "$WD/receiver.pid" 2>/dev/null)"
            if [[ "$RECEIVER_PID" =~ ^[0-9]+$ ]]; then
              kill -TERM "$RECEIVER_PID" 2>/dev/null
            fi
          fi

          sudo pkill -TERM -u cfuser -x cloudflared 2>/dev/null
          sleep 0.5

          CF_UID="$(id -u cfuser 2>/dev/null)"
          if [[ "$CF_UID" =~ ^[0-9]+$ ]]; then
            sudo ip rule del \
              priority 100 \
              uidrange "$CF_UID-$CF_UID" \
              table 100 2>/dev/null
          fi

          sudo ip route flush table 100 2>/dev/null
          sudo userdel cfuser 2>/dev/null

          sudo rm -f \
            "$WD/vpn.ovpn" \
            "$WD/pass.txt" \
            "$WD/cf-token.txt" \
            "$WD/openvpn.pid"

          rm -f \
            "$WD/receiver.pid" \
            "$WD/start_receiver.sh" \
            "$WD/start_cf.sh" \
            "$WD/check_public.sh"
