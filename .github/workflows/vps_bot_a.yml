name: Continuous VPN Worker - Instance A

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_a]

jobs:
  run-instance-a:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download cloudflared (before VPN)
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "❌❌❌ FATAL ERROR (uncaught) ❌❌❌"; echo "Step: Download cloudflared"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $rc"; echo "Timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"' ERR
          curl -fsSL --retry 5 --retry-delay 3 -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared --version
          echo "✅ cloudflared downloaded"

      - name: Validate Required Secrets
        run: |
          set -Eeuo pipefail
          missing=0
          [ -n "${{ secrets.VPN_CONFIG }}" ]      || { echo "❌ VPN_CONFIG missing"; missing=1; }
          [ -n "${{ secrets.VPN_USERNAME }}" ]    || { echo "❌ VPN_USERNAME missing"; missing=1; }
          [ -n "${{ secrets.VPN_PASSWORD }}" ]    || { echo "❌ VPN_PASSWORD missing"; missing=1; }
          [ -n "${{ secrets.GH_TOKEN }}" ]        || { echo "❌ GH_TOKEN missing"; missing=1; }
          [ -n "${{ secrets.WORKER_URL }}" ]      || { echo "❌ WORKER_URL missing"; missing=1; }
          [ -n "${{ secrets.REGISTER_SECRET }}" ] || { echo "❌ REGISTER_SECRET missing"; missing=1; }
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "✅ All required secrets are set"

      - name: Install OpenVPN
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn
          openvpn --version | head -n 1

      - name: Setup VPN Credentials
        run: |
          set -Eeuo pipefail
          echo "${{ secrets.VPN_USERNAME }}" > pass.txt
          echo "${{ secrets.VPN_PASSWORD }}" >> pass.txt
          chmod 600 pass.txt
          echo "${{ secrets.VPN_CONFIG }}" > config.ovpn
          sed -i 's/\r$//' config.ovpn
          sed -i '/^persist-key/d;/^persist-tun/d;/^auth-user-pass/d' config.ovpn
          echo "auth-user-pass pass.txt" >> config.ovpn
          echo "data-ciphers AES-128-CBC" >> config.ovpn
          echo "data-ciphers-fallback AES-128-CBC" >> config.ovpn
          echo "✅ VPN config prepared"

      - name: Check IP Before VPN
        run: |
          set -Eeuo pipefail
          echo "Exit IP (Before VPN):"
          curl -s --max-time 15 https://ifconfig.me || echo "UNKNOWN"
          echo ""

      - name: Start VPN
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "❌❌❌ FATAL ERROR (uncaught) ❌❌❌"; echo "Step: Start VPN"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $rc"; echo "Timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"' ERR

          echo "--- Enabling TUN device ---"
          sudo mkdir -p /dev/net
          [ -c /dev/net/tun ] || sudo mknod /dev/net/tun c 10 200
          sudo chmod 666 /dev/net/tun
          ls -l /dev/net/tun
          echo "✅ TUN device is available"

          MAX_ATTEMPTS=80
          ATTEMPT_WAIT=45
          PAUSE_BETWEEN=15
          VPN_OK=0

          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
            echo "==============================="
            echo "🔌 VPN attempt $ATTEMPT/$MAX_ATTEMPTS at $(date +%H:%M:%S)"
            sudo pkill -KILL openvpn 2>/dev/null || true
            : > /tmp/vpn.log
            sudo nohup openvpn --config config.ovpn --verb 6 > /tmp/vpn.log 2>&1 &

            for S in $(seq 1 $ATTEMPT_WAIT); do
              sleep 1
              if ! pgrep -x openvpn > /dev/null; then
                echo "⚠️ OpenVPN exited at second $S"
                break
              fi
              if ip link show tun0 > /dev/null 2>&1 && grep -q "Initialization Sequence Completed" /tmp/vpn.log; then
                echo "✅ tun0 appeared at second $S"
                VPN_OK=1
                break
              fi
            done

            if [ "$VPN_OK" -eq 1 ]; then
              echo "==============================="
              echo "--- VPN Log (last 40 lines) ---"
              tail -n 40 /tmp/vpn.log
              echo "==============================="
              echo "✅ OpenVPN process is RUNNING"
              break
            fi

            echo "--- Last VPN log lines ---"
            tail -n 8 /tmp/vpn.log || true
            sudo pkill -KILL openvpn 2>/dev/null || true
            echo "⏳ Not connected (session probably still held). Retrying in ${PAUSE_BETWEEN}s..."
            sleep $PAUSE_BETWEEN
          done

          if [ "$VPN_OK" -ne 1 ]; then
            echo "❌ VPN did not connect after $MAX_ATTEMPTS attempts"
            exit 1
          fi

      - name: Verify VPN Connection
        run: |
          set -Eeuo pipefail
          echo "Exit IP (After VPN):"
          curl -s --max-time 15 https://ifconfig.me || echo "UNKNOWN"
          echo ""
          echo "VPN Tunnel Interface (tun0):"
          ip addr show tun0
          echo "✅ tun0 is UP"
          echo "Routing Table:"
          ip route

      - name: Check Exit IP Gate
        run: |
          set -Eeuo pipefail
          EXPECTED="${{ secrets.EXPECTED_EXIT_IP }}"
          if [ -z "$EXPECTED" ]; then
            echo "⚠️ EXPECTED_EXIT_IP not set — gate skipped."
            exit 0
          fi
          ACTUAL=$(curl -s --max-time 15 https://ifconfig.me || true)
          echo "Expected: $EXPECTED | Actual: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ Exit IP mismatch"
            exit 1
          fi
          echo "✅ Exit IP matches"

      - name: Start Receiver
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "❌❌❌ FATAL ERROR (uncaught) ❌❌❌"; echo "Step: Start Receiver"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $rc"; echo "Timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"' ERR
          python3 --version
          echo "--- Starting receiver.py (unbuffered) on port 8081 ---"
          nohup python3 -u receiver.py > /tmp/receiver.log 2>&1 &
          RPID=$!
          echo "RECEIVER_PID=$RPID" >> $GITHUB_ENV
          echo "✅ Receiver PID: $RPID"
          sleep 5
          ss -ltnp | grep 8081 || true
          echo "--- Receiver Log (first 5 seconds) ---"
          cat /tmp/receiver.log || true
          if ! kill -0 "$RPID" 2>/dev/null; then
            echo "❌ receiver.py died"
            exit 1
          fi
          echo "✅ receiver.py process is alive"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:8081/ || true)
          echo "HTTP response code: $CODE"
          if [ "$CODE" = "000" ] || [ -z "$CODE" ]; then
            echo "❌ Receiver not responding"
            exit 1
          fi
          echo "✅ Receiver responded with HTTP $CODE (server is up)"

      - name: Start Cloudflared Quick Tunnel and Register
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "❌❌❌ FATAL ERROR (uncaught) ❌❌❌"; echo "Step: Start Cloudflared Quick Tunnel and Register"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $rc"; echo "Timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"' ERR
          INSTANCE="A"
          ./cloudflared --version
          echo "--- Starting cloudflared quick tunnel ---"
          nohup ./cloudflared tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:8081 > /tmp/cloudflared.log 2>&1 &
          CFPID=$!
          echo "CF_PID=$CFPID" >> $GITHUB_ENV
          echo "✅ cloudflared PID: $CFPID"

          echo "--- Waiting for tunnel URL ---"
          TUNNEL_URL=""
          for i in $(seq 1 60); do
            TUNNEL_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log 2>/dev/null | grep -v '^https://api\.' | head -n 1 || true)
            [ -n "$TUNNEL_URL" ] && break
            if ! kill -0 "$CFPID" 2>/dev/null; then
              echo "❌ cloudflared died"; tail -n 30 /tmp/cloudflared.log; exit 1
            fi
            sleep 2
          done
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ No tunnel URL found"; tail -n 30 /tmp/cloudflared.log; exit 1
          fi
          echo "✅ Tunnel URL found: $TUNNEL_URL"
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV

          echo "--- Verifying public chain (tunnel -> receiver -> VPN -> Binance) ---"
          CHAIN_OK=0
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$TUNNEL_URL/fapi/v1/ping" || true)
            echo "Public chain test $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then CHAIN_OK=1; break; fi
            sleep 5
          done
          if [ "$CHAIN_OK" -ne 1 ]; then echo "❌ Public chain failed"; exit 1; fi
          echo "✅ Public chain works"

          echo "--- Registering with tunnel-proxy ---"
          REG_OK=0
          for i in $(seq 1 5); do
            RESP=$(curl -s --max-time 15 -X POST "${{ secrets.WORKER_URL }}/__register" \
              -H "X-Secret: ${{ secrets.REGISTER_SECRET }}" \
              -H "Content-Type: application/json" \
              -d "{\"instance\":\"$INSTANCE\",\"url\":\"$TUNNEL_URL\"}" || true)
            echo "Register attempt $i: '$RESP'"
            if [ "$RESP" = "ok" ]; then REG_OK=1; break; fi
            sleep 3
          done
          if [ "$REG_OK" -ne 1 ]; then echo "❌ Registration failed"; exit 1; fi
          echo "✅ Registered with tunnel-proxy"

      - name: Run Task and Ping Pong Loop
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "❌❌❌ FATAL ERROR (uncaught) ❌❌❌"; echo "Step: Run Task and Ping Pong Loop"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $rc"; echo "Timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"' ERR

          INSTANCE="A"
          OTHER_EVENT="trigger_a2"
          DURATION_MINUTES=300
          TRIGGER_MINUTE=295
          HEARTBEAT_EVERY=5
          OTHER_TRIGGERED=0

          trigger_other() {
            local code
            for t in 1 2 3; do
              code=$(curl -s -o /tmp/dispatch.out -w "%{http_code}" --max-time 20 -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/dispatches" \
                -d "{\"event_type\":\"$OTHER_EVENT\"}" || true)
              echo "🚀 Trigger $OTHER_EVENT attempt $t: HTTP $code"
              if [ "$code" = "204" ]; then OTHER_TRIGGERED=1; return 0; fi
              sleep 3
            done
            return 1
          }

          shutdown_instance() {
            echo "🛑 [$(date +%H:%M:%S)] Shutting down instance $INSTANCE..."
            curl -s --max-time 10 -X POST "${{ secrets.WORKER_URL }}/__deregister" \
              -H "X-Secret: ${{ secrets.REGISTER_SECRET }}" \
              -H "Content-Type: application/json" \
              -d "{\"instance\":\"$INSTANCE\",\"url\":\"$TUNNEL_URL\"}" > /tmp/dereg.out 2>&1 || true
            echo "Deregister: '$(cat /tmp/dereg.out 2>/dev/null || true)'"
            kill "$CF_PID" 2>/dev/null || true
            kill "$RECEIVER_PID" 2>/dev/null || true
            sleep 1
            sudo pkill -TERM openvpn 2>/dev/null || true
            sleep 3
            sudo pkill -KILL openvpn 2>/dev/null || true
            echo "✅ Shutdown complete"
          }

          MINUTE=0
          while [ "$MINUTE" -lt "$DURATION_MINUTES" ]; do
            MINUTE=$((MINUTE + 1))

            # 1. Local process checks
            if pgrep -x openvpn > /dev/null && ip link show tun0 > /dev/null 2>&1; then VPN_ST="ACTIVE"; else VPN_ST="DEAD"; fi
            if kill -0 "$RECEIVER_PID" 2>/dev/null; then RCV_ST="ACTIVE"; else RCV_ST="DEAD"; fi
            if kill -0 "$CF_PID" 2>/dev/null; then CF_ST="ACTIVE"; else CF_ST="DEAD"; fi

            # 2. FULL CHAIN TEST (Checks Binance Worker end-to-end)
            PING_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://curly-field-a765.abdo-xchg-61892.workers.dev/fapi/v1/ping" || true)
            if [ "$PING_CODE" = "200" ]; then CHAIN_ST="ACTIVE"; else CHAIN_ST="DEAD(http_$PING_CODE)"; fi

            IP_RC=0
            CURRENT_IP=$(curl -s --connect-timeout 5 --max-time 10 https://ifconfig.me 2>/tmp/loop_ip_err.log) || IP_RC=$?
            if [ "$IP_RC" -ne 0 ] || [ -z "$CURRENT_IP" ]; then CURRENT_IP="UNKNOWN(curl_exit=$IP_RC)"; fi

            echo "✅ [$(date +%H:%M:%S)] Minute $MINUTE/$DURATION_MINUTES | VPN: $VPN_ST | Receiver: $RCV_ST | Tunnel: $CF_ST | Full Chain: $CHAIN_ST | IP: $CURRENT_IP"

            # IF ANYTHING FAILS (including Binance Worker full chain test): TRIGGER OTHER AND DIE
            if [ "$VPN_ST" != "ACTIVE" ] || [ "$RCV_ST" != "ACTIVE" ] || [ "$CF_ST" != "ACTIVE" ] || [ "$CHAIN_ST" != "ACTIVE" ]; then
              echo "❌ Component or Full Chain failed! (Binance Worker HTTP: $PING_CODE)"
              echo "Last logs:"
              tail -n 15 /tmp/vpn.log || true
              tail -n 15 /tmp/cloudflared.log || true
              if [ "$OTHER_TRIGGERED" -eq 0 ]; then
                echo "🚨 Emergency: triggering the other instance immediately!"
                trigger_other || true
              fi
              shutdown_instance
              exit 1
            fi

            # Heartbeat every 5 minutes
            if [ $((MINUTE % HEARTBEAT_EVERY)) -eq 0 ]; then
              HB=$(curl -s --max-time 10 -X POST "${{ secrets.WORKER_URL }}/__register" \
                -H "X-Secret: ${{ secrets.REGISTER_SECRET }}" \
                -H "Content-Type: application/json" \
                -d "{\"instance\":\"$INSTANCE\",\"url\":\"$TUNNEL_URL\"}" || true)
              echo "💓 Heartbeat: '$HB'"
            fi

            # Trigger handoff at minute 295
            if [ "$MINUTE" -ge "$TRIGGER_MINUTE" ] && [ "$OTHER_TRIGGERED" -eq 0 ]; then
              echo "🚀 Minute $MINUTE: triggering the other instance"
              trigger_other || echo "⚠️ Trigger failed, will retry next minute"
            fi

            sleep 60
          done

          if [ "$OTHER_TRIGGERED" -eq 0 ]; then
            echo "⚠️ Last chance: the other instance was never triggered"
            trigger_other || echo "❌ Last-chance trigger failed"
          fi
          shutdown_instance
          echo "✅ Instance $INSTANCE finished its $DURATION_MINUTES minutes"

      - name: Deregister (safety)
        if: always()
        run: |
          set -Eeuo pipefail
          if [ -z "${TUNNEL_URL:-}" ]; then
            echo "No tunnel URL, nothing to deregister"
            exit 0
          fi
          RESP=$(curl -s --max-time 10 -X POST "${{ secrets.WORKER_URL }}/__deregister" \
            -H "X-Secret: ${{ secrets.REGISTER_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"instance\":\"A\",\"url\":\"$TUNNEL_URL\"}" || true)
          echo "Safety deregister: '$RESP'"
