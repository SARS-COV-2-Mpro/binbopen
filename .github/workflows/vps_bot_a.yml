name: Continuous VPN Worker - Instance A

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Run minutes (default: 300)'
        default: '300'
      trigger:
        description: 'Handoff minute (default: 295)'
        default: '295'
  repository_dispatch:
    types: [trigger_a]

jobs:
  run-instance-a:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      INSTANCE: "A"
      OTHER_EVENT: "trigger_a2"
      DURATION_MINUTES: ${{ github.event.client_payload.duration || github.event.inputs.duration || '300' }}
      TRIGGER_MINUTE: ${{ github.event.client_payload.trigger || github.event.inputs.trigger || '295' }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      EXPECTED_EXIT_IP: ${{ secrets.EXPECTED_EXIT_IP }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Job Info
        run: |
          echo "=================================================="
          echo "Job Started (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Instance: $INSTANCE | Handoff Target: $OTHER_EVENT"
          echo "Duration: $DURATION_MINUTES min | Handoff at: Minute $TRIGGER_MINUTE"
          echo "Runner Specs: $(uname -sr) | $(nproc) CPU | $(free -m | awk '/Mem:/{print $2" MB RAM"}')"
          echo "=================================================="

      - name: Download cloudflared
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 5 --retry-delay 3 -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared --version
          echo "✅ cloudflared binary ready"

      - name: Validate Secrets
        env:
          VPN_CONFIG: ${{ secrets.VPN_CONFIG }}
          VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          set -Eeuo pipefail
          MISSING=0
          for V in VPN_CONFIG VPN_USERNAME VPN_PASSWORD GH_TOKEN CF_TUNNEL_TOKEN; do
            if [ -z "${!V:-}" ]; then
              echo "❌ Missing secret: $V"
              MISSING=1
            else
              echo "✅ Secret $V is set"
            fi
          done
          if [ "$MISSING" = "1" ]; then exit 1; fi

      - name: Create Helper Scripts
        run: |
          set -Eeuo pipefail
          cat > startup_fail.sh <<'ENDSCRIPT'
          #!/usr/bin/env bash
          echo "❌ STARTUP FAILURE at $(date -u +%H:%M:%S): $1"
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 20 -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
              -d "{\"event_type\":\"$OTHER_EVENT\",\"client_payload\":{\"duration\":\"$DURATION_MINUTES\",\"trigger\":\"$TRIGGER_MINUTE\"}}" || true)
            echo "Trigger $OTHER_EVENT -> HTTP $CODE"
            if [ "$CODE" = "204" ]; then break; fi
            sleep 3
          done
          sudo pkill -x openvpn || true
          exit 0
          ENDSCRIPT
          chmod +x startup_fail.sh
          echo "✅ Helper scripts created"

      - name: Install OpenVPN
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn curl jq
          echo "✅ OpenVPN installed: $(openvpn --version | head -1)"

      - name: Setup VPN Credentials & Packet Optimization
        run: |
          set -Eeuo pipefail
          echo "${{ secrets.VPN_CONFIG }}" > config.ovpn
          echo "${{ secrets.VPN_USERNAME }}" > pass.txt
          echo "${{ secrets.VPN_PASSWORD }}" >> pass.txt
          chmod 600 pass.txt
          sed -i 's/\r$//' config.ovpn
          sed -i '/^persist-key/d;/^persist-tun/d' config.ovpn
          sed -i '/^data-ciphers/d' config.ovpn
          sed -i 's|^auth-user-pass.*|auth-user-pass pass.txt|' config.ovpn
          if ! grep -q '^auth-user-pass' config.ovpn; then echo "auth-user-pass pass.txt" >> config.ovpn; fi
          
          # Fix TCP Packet stalling for POST requests
          echo "mssfix 1300" >> config.ovpn
          echo "fragment 1300" >> config.ovpn
          echo "data-ciphers AES-128-CBC" >> config.ovpn
          echo "data-ciphers-fallback AES-128-CBC" >> config.ovpn
          echo "✅ VPN credentials and MTU optimization configured"

      - name: Check IP Before VPN
        run: |
          set -Eeuo pipefail
          IP=$(curl -s -m 10 https://ifconfig.me || echo "UNKNOWN")
          GW=$(ip route show default | awk '/default/{print $3; exit}')
          DEV=$(ip route show default | awk '/default/{print $5; exit}')
          echo "IP before VPN: $IP"
          echo "Original gateway: $GW via $DEV"
          echo "PRE_IP=$IP" >> "$GITHUB_ENV"
          echo "ORIG_GW=$GW" >> "$GITHUB_ENV"
          echo "ORIG_DEV=$DEV" >> "$GITHUB_ENV"

      - name: Start VPN
        run: |
          set -Eeuo pipefail
          T0=$(date +%s)
          CONNECTED=0
          for ATTEMPT in $(seq 1 80); do
            echo "[$(date -u +%H:%M:%S)] VPN attempt $ATTEMPT/80"
            sudo pkill -x openvpn 2>/dev/null || true
            sleep 1
            sudo openvpn --config config.ovpn --verb 3 --log vpn.log --daemon --writepid vpn.pid
            for i in $(seq 1 45); do
              if ip addr show tun0 2>/dev/null | grep -q 'inet '; then
                CONNECTED=1
                break
              fi
              sleep 1
            done
            if [ "$CONNECTED" = "1" ]; then break; fi
            sudo pkill -x openvpn 2>/dev/null || true
            sleep 5
          done
          if [ "$CONNECTED" != "1" ]; then
            echo "❌ VPN connection failed"
            tail -50 vpn.log || true
            exit 1
          fi
          echo "✅ VPN interface tun0 connected"

      - name: Verify Binance Reachability via VPN
        run: |
          set -Eeuo pipefail
          OK=0
          for i in $(seq 1 30); do
            OUT=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" --interface tun0 --max-time 8 https://fapi.binance.com/fapi/v1/ping || true)
            echo "Binance via tun0 check $i/30: ${OUT:-000 0}"
            if [ "${OUT%% *}" = "200" ]; then OK=1; break; fi
            sleep 2
          done
          if [ "$OK" != "1" ]; then
            ./startup_fail.sh "Binance not reachable through tun0"
            exit 1
          fi
          echo "✅ VPN data path to Binance verified"

      - name: Check Exit IP Gate
        run: |
          set -Eeuo pipefail
          EXIT_IP=$(curl -s --interface tun0 -m 8 https://api.ipify.org | tr -d '[:space:]' || true)
          echo "Exit IP via tun0: ${EXIT_IP:-UNKNOWN} | Before VPN: $PRE_IP"
          if [ -n "${EXPECTED_EXIT_IP:-}" ] && [ "$EXIT_IP" != "$EXPECTED_EXIT_IP" ]; then
            echo "❌ Exit IP mismatch (Expected: $EXPECTED_EXIT_IP, Got: $EXIT_IP)"
            ./startup_fail.sh "exit IP mismatch"
            exit 1
          fi
          echo "EXIT_IP=$EXIT_IP" >> "$GITHUB_ENV"

      - name: Start Receiver (Python Proxy)
        run: |
          set -Eeuo pipefail
          PY=$(command -v python3)
          READY=0
          for ATTEMPT in 1 2 3; do
            pkill -f "python.*receiver.py" 2>/dev/null || true
            sleep 1
            nohup "$PY" -u receiver.py > receiver.log 2>&1 &
            RECEIVER_PID=$!
            for i in $(seq 1 6); do
              sleep 2
              OUT=$(curl -s -o /dev/null -w "%{http_code}" --noproxy '*' --max-time 5 http://127.0.0.1:8081/fapi/v1/ping || true)
              if [ "$OUT" = "200" ]; then READY=1; break; fi
            done
            if [ "$READY" = "1" ]; then break; fi
          done
          if [ "$READY" != "1" ]; then
            echo "❌ Receiver failed to start"
            cat receiver.log || true
            ./startup_fail.sh "receiver not responding"
            exit 1
          fi
          echo "RECEIVER_PID=$RECEIVER_PID" >> "$GITHUB_ENV"
          echo "✅ Receiver server running on port 8081"

      - name: Route cloudflared outside VPN
        run: |
          set -Eeuo pipefail
          sudo useradd -r -M -s /usr/sbin/nologin cfuser 2>/dev/null || true
          CF_UID=$(id -u cfuser)
          sudo install -m 755 cloudflared /usr/local/bin/cfd
          sudo ip route replace default via "$ORIG_GW" dev "$ORIG_DEV" onlink table 100
          sudo ip rule del uidrange $CF_UID-$CF_UID lookup 100 2>/dev/null || true
          sudo ip rule add uidrange $CF_UID-$CF_UID lookup 100 priority 100
          echo "✅ Egress routing table 100 applied to cfuser"

      - name: Start Permanent Cloudflare Named Tunnel
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          set -Eeuo pipefail
          echo "[$(date -u +%H:%M:%S)] Starting Permanent Cloudflare Named Tunnel..."
          sudo pkill -f "cloudflared" 2>/dev/null || true
          sleep 1
          
          # Run named tunnel using secret token (routes outside VPN using cfuser)
          nohup sudo -u cfuser env HOME=/tmp /usr/local/bin/cfd tunnel --no-autoupdate run --token "$CF_TUNNEL_TOKEN" > cloudflared.log 2>&1 < /dev/null &
          
          sleep 5
          if pgrep -af "cloudflared" > /dev/null; then
            echo "✅ Cloudflare Named Tunnel active"
          else
            echo "❌ Cloudflare failed to connect"
            cat cloudflared.log || true
            ./startup_fail.sh "cloudflared run failed"
            exit 1
          fi

      - name: Run Task Loop and Trigger Handoff
        run: |
          set -Eeuo pipefail
          GH_API="https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches"
          LOCAL_URL="http://127.0.0.1:8081/fapi/v1/ping"
          TRIGGERED=0
          
          probe() {
            curl -s -o /dev/null --noproxy '*' --connect-timeout 5 --max-time 10 -w "%{http_code} %{time_total}" "$1" 2>/dev/null || echo "000 0"
          }
          
          trigger_other() {
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -m 20 -X POST \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$GH_API" -d "{\"event_type\":\"$OTHER_EVENT\",\"client_payload\":{\"duration\":\"$DURATION_MINUTES\",\"trigger\":\"$TRIGGER_MINUTE\"}}" || true)
              echo "[$(date -u +%H:%M:%S)] Handoff Trigger $OTHER_EVENT -> HTTP $code"
              if [ "$code" = "204" ]; then TRIGGERED=1; return 0; fi
              sleep 3
            done
            return 1
          }

          START=$(date +%s)
          NEXT=$START
          echo "[$(date -u +%H:%M:%S)] Loop started for $DURATION_MINUTES min (Handoff at min $TRIGGER_MINUTE)"
          
          while true; do
            NEXT=$((NEXT+60))
            NOW=$(date +%s)
            if (( NEXT > NOW )); then sleep $((NEXT-NOW)); else NEXT=$NOW; fi
            
            NOW=$(date +%s)
            MIN=$(( (NOW-START)/60 ))
            if (( MIN >= DURATION_MINUTES )); then break; fi

            # Verify components
            if ! pgrep -x openvpn >/dev/null || ! ip addr show tun0 >/dev/null 2>&1; then
              echo "❌ OpenVPN died"
              if (( TRIGGERED == 0 )); then trigger_other || true; fi
              exit 1
            fi
            
            read -r L_CODE L_TIME <<< "$(probe "$LOCAL_URL")"
            echo "[$(date -u +%H:%M:%S)] Min $MIN/$DURATION_MINUTES | Local Receiver ping: $L_CODE (${L_TIME}s)"
            
            if (( MIN >= TRIGGER_MINUTE )) && (( TRIGGERED == 0 )); then
              echo "🚀 Handoff time reached! Triggering $OTHER_EVENT..."
              trigger_other || true
            fi
          done

          echo "✅ Completed $DURATION_MINUTES minutes cleanly."
          if (( TRIGGERED == 0 )); then trigger_other || true; fi

      - name: Cleanup on Exit
        if: always()
        run: |
          sudo pkill -f "cloudflared" 2>/dev/null || true
          pkill -f "python.*receiver.py" 2>/dev/null || true
          sudo pkill -x openvpn 2>/dev/null || true
          echo "🏁 Teardown complete"
