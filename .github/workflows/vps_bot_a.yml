name: Continuous VPN Worker - Instance A

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Total runtime in minutes'
        required: false
        default: '60'
      trigger_minute:
        description: 'Minute at which to dispatch Instance A2'
        required: false
        default: '50'
  repository_dispatch:
    types: [trigger_a]

env:
  OTHER_EVENT: trigger_a2

jobs:
  vpn-worker:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap (DNS, packages, config, helper scripts)
        env:
          VPN_CONFIG: ${{ secrets.VPN_CONFIG }}
          VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          set -e
          WD="${{ github.workspace }}"
          cd "$WD"

          echo "---- writing resolv.conf ----"
          sudo bash -c 'cat > /etc/resolv.conf <<EOF
          nameserver 8.8.8.8
          nameserver 1.1.1.1
          EOF'

          echo "---- downloading cloudflared in background while apt installs ----"
          ( curl -fsSL -o /tmp/cfd https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 ) &
          CFD_PID=$!

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openvpn netcat-openbsd

          wait "$CFD_PID"
          sudo install -m 0755 /tmp/cfd /usr/local/bin/cfd
          cfd --version || { echo "FATAL: cloudflared binary broken"; exit 1; }

          echo "---- validating secrets ----"
          for v in VPN_CONFIG VPN_USERNAME VPN_PASSWORD GH_TOKEN CF_TUNNEL_TOKEN; do
            val="$(eval echo \$$v)"
            if [ -z "$val" ]; then
              echo "FATAL: secret $v is empty"
              exit 1
            fi
          done

          echo "---- writing vpn.ovpn ----"
          printf '%s' "$VPN_CONFIG" | tr -d '\r' > "$WD/vpn.ovpn"

          echo "---- forcing proto=tcp / port=443 on every remote line ----"
          awk '
            BEGIN { sawproto=0 }
            /^[[:space:]]*remote[[:space:]]/ {
              n = split($0, f, /[[:space:]]+/)
              f[3] = "443"
              if (n >= 4) { f[4] = "tcp" } else { f[n+1] = "tcp" }
              line = f[1]
              for (i = 2; i <= 4; i++) line = line " " f[i]
              print line
              next
            }
            /^[[:space:]]*proto[[:space:]]/ {
              print "proto tcp"
              sawproto=1
              next
            }
            { print }
            END {
              if (sawproto == 0) {
                # no-op: proto will be prepended below if still missing
              }
            }
          ' "$WD/vpn.ovpn" > "$WD/vpn.ovpn.tmp" && mv "$WD/vpn.ovpn.tmp" "$WD/vpn.ovpn"

          if ! grep -qE '^[[:space:]]*proto[[:space:]]' "$WD/vpn.ovpn"; then
            { echo "proto tcp"; cat "$WD/vpn.ovpn"; } > "$WD/vpn.ovpn.tmp" && mv "$WD/vpn.ovpn.tmp" "$WD/vpn.ovpn"
          fi

          REMOTE_COUNT=$(grep -cE '^[[:space:]]*remote[[:space:]]' "$WD/vpn.ovpn" || true)
          if [ "${REMOTE_COUNT:-0}" -gt 1 ] && ! grep -q '^remote-random' "$WD/vpn.ovpn"; then
            echo "remote-random" >> "$WD/vpn.ovpn"
            echo "---- added remote-random ($REMOTE_COUNT remotes found) ----"
          fi

          echo "---- stripping conflicting/duplicate directives ----"
          sed -i -E '/^(explicit-exit-notify|auth-user-pass|auth-nocache|data-ciphers(-fallback)?|hand-window|tls-timeout|server-poll-timeout|connect-retry|resolv-retry|fast-io|sndbuf|rcvbuf|mssfix|tun-mtu)\b/d' "$WD/vpn.ovpn"

          echo "---- writing credentials file ----"
          printf '%s\n%s\n' "$VPN_USERNAME" "$VPN_PASSWORD" > "$WD/pass.txt"
          chmod 600 "$WD/pass.txt"

          echo "---- appending locked-in tuning block ----"
          cat >> "$WD/vpn.ovpn" <<CFG
          auth-user-pass $WD/pass.txt
          auth-nocache
          data-ciphers AES-128-CBC
          data-ciphers-fallback AES-128-CBC
          hand-window 130
          tls-timeout 130
          server-poll-timeout 20
          connect-retry 2 5
          resolv-retry infinite
          fast-io
          sndbuf 524288
          rcvbuf 524288
          mssfix 1400
          tun-mtu 1400
          CFG

          echo "---- FINAL proto/remote lines ----"
          grep -E '^[[:space:]]*(remote|proto)\b' "$WD/vpn.ovpn"

          if grep -E '^[[:space:]]*(remote|proto)\b' "$WD/vpn.ovpn" | grep -qi udp; then
            echo "FATAL: config still contains a UDP profile — aborting before wasting attempts"
            exit 1
          fi

          echo "---- syntax sanity check ----"
          sudo openvpn --config "$WD/vpn.ovpn" --test-crypto

          echo "---- capturing original default route (for cloudflared bypass) ----"
          ORIG_GW=$(ip route show default | awk '{print $3; exit}')
          ORIG_IF=$(ip route show default | awk '{print $5; exit}')
          echo "ORIG_GW=$ORIG_GW" >> "$GITHUB_ENV"
          echo "ORIG_IF=$ORIG_IF" >> "$GITHUB_ENV"
          echo "Captured ORIG_GW=$ORIG_GW ORIG_IF=$ORIG_IF"

          echo "---- writing start_cf.sh ----"
          cat > "$WD/start_cf.sh" <<'CFEOF'
          #!/usr/bin/env bash
          set -u
          WD="$(pwd)"
          RAW_TOKEN="${CF_TUNNEL_TOKEN:-}"
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          if echo "$TOKEN" | grep -qo 'eyJ[A-Za-z0-9_-]*'; then
            TOKEN=$(echo "$TOKEN" | grep -o 'eyJ[A-Za-z0-9_.-]*' | head -n1)
          fi

          pkill -f "cfd tunnel" 2>/dev/null || true
          sleep 1

          if [ "${CF_MODE:-plain}" = "isolated" ]; then
            sudo -u cfuser -H nohup cfd tunnel --no-autoupdate run --token "$TOKEN" > "$WD/cloudflared.log" 2>&1 &
          else
            nohup cfd tunnel --no-autoupdate run --token "$TOKEN" > "$WD/cloudflared.log" 2>&1 &
          fi
          echo $! > "$WD/cfd.pid"

          for i in $(seq 1 300); do
            if grep -qi "Registered tunnel connection" "$WD/cloudflared.log" 2>/dev/null; then
              echo "cloudflared tunnel registered"
              exit 0
            fi
            sleep 0.2
          done
          echo "FATAL: cloudflared did not register within 60s"
          tail -n 40 "$WD/cloudflared.log" || true
          exit 1
          CFEOF
          chmod +x "$WD/start_cf.sh"

      - name: Start VPN
        run: |
          set +e
          WD="${{ github.workspace }}"
          cd "$WD"
          MAX_ATTEMPTS=40
          ATTEMPT=0

          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            ATTEMPT=$((ATTEMPT+1))
            echo "===== VPN attempt $ATTEMPT/$MAX_ATTEMPTS ====="
            sudo pkill openvpn 2>/dev/null || true
            sudo rm -f /tmp/vpn.pid
            sleep 1

            sudo openvpn --config "$WD/vpn.ovpn" --verb 4 --daemon \
              --log "$WD/vpn.log" --writepid /tmp/vpn.pid

            RESULT=""
            TLS_SEEN_AT=""
            TICK=0
            MAX_TICKS=700   # 700 * 200ms = 140s

            while [ "$TICK" -lt "$MAX_TICKS" ]; do
              TICK=$((TICK+1))
              sleep 0.2

              if sudo grep -q "Initialization Sequence Completed" "$WD/vpn.log" 2>/dev/null; then
                RESULT="up"
                break
              fi

              if sudo grep -qE "AUTH_FAILED|Exiting due to fatal error|Connection refused|SIGTERM|TLS Error|tls-crypt|Options error" "$WD/vpn.log" 2>/dev/null; then
                RESULT="fail"
                break
              fi

              # Fast TLS-stall detector: TCP+TLS connects but handshake never progresses
              if sudo grep -q "TLS: Initial packet from" "$WD/vpn.log" 2>/dev/null; then
                if [ -z "$TLS_SEEN_AT" ]; then
                  TLS_SEEN_AT=$TICK
                fi
                if ! sudo grep -qE "VERIFY OK|Peer Connection Initiated" "$WD/vpn.log" 2>/dev/null; then
                  if [ $((TICK - TLS_SEEN_AT)) -ge 100 ]; then
                    RESULT="tls_stalled"
                    break
                  fi
                fi
              fi

              if [ $((TICK % 25)) -eq 0 ]; then
                PUSH_COUNT=$(sudo grep -c "PUSH_REQUEST" "$WD/vpn.log" 2>/dev/null)
                PUSH_COUNT=${PUSH_COUNT:-0}
                case "$PUSH_COUNT" in ''|*[!0-9]*) PUSH_COUNT=0 ;; esac
                if [ "$PUSH_COUNT" -ge 5 ] 2>/dev/null; then
                  RESULT="push_stuck"
                  break
                fi
              fi
            done

            [ -z "$RESULT" ] && RESULT="wait"

            echo "---- attempt $ATTEMPT result: $RESULT ----"
            if [ "$RESULT" != "up" ]; then
              sudo tail -n 60 "$WD/vpn.log" 2>/dev/null
              sudo pkill openvpn 2>/dev/null || true
            else
              echo "VPN UP after $ATTEMPT attempt(s)"
              break
            fi

            case "$RESULT" in
              tls_stalled)
                echo "TLS handshake stalled (likely DPI/fingerprint block on this exit IP) — fast retry"
                sleep 3
                ;;
              push_stuck)
                if [ $((ATTEMPT % 5)) -eq 0 ]; then sleep 90; else sleep 8; fi
                ;;
              wait)
                if [ $((ATTEMPT % 5)) -eq 0 ]; then sleep 60; else sleep 4; fi
                ;;
              *)
                sleep 8
                ;;
            esac
          done

          if [ "$RESULT" != "up" ]; then
            echo "STARTUP FAILED: VPN did not connect after $MAX_ATTEMPTS attempts"
            exit 1
          fi

      - name: Verify VPN + Start services
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          EXPECTED_EXIT_IP: ${{ secrets.EXPECTED_EXIT_IP }}
        run: |
          set -e
          WD="${{ github.workspace }}"
          cd "$WD"

          echo "---- verifying connectivity through tun0 ----"
          OK=0
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --interface tun0 --max-time 5 https://fapi.binance.com/fapi/v1/ping)
            if [ "$CODE" = "200" ]; then OK=$((OK+1)); fi
            sleep 0.3
          done
          echo "Binance ping successes: $OK/30"
          if [ "$OK" -lt 20 ]; then
            echo "FATAL: tunnel connectivity unreliable ($OK/30)"
            exit 1
          fi

          if [ -n "${EXPECTED_EXIT_IP:-}" ]; then
            ACTUAL_IP=$(curl -s --interface tun0 --max-time 10 https://api.ipify.org)
            echo "Exit IP: $ACTUAL_IP (expected: $EXPECTED_EXIT_IP)"
            if [ "$ACTUAL_IP" != "$EXPECTED_EXIT_IP" ]; then
              echo "FATAL: exit IP mismatch"
              exit 1
            fi
          fi

          echo "---- starting receiver ----"
          nohup python3 "$WD/receiver.py" > "$WD/receiver.log" 2>&1 &
          echo $! > "$WD/receiver.pid"

          READY=0
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://127.0.0.1:8081/fapi/v1/ping)
            if [ "$CODE" = "200" ]; then READY=1; break; fi
            sleep 0.3
          done
          if [ "$READY" -ne 1 ]; then
            echo "FATAL: receiver did not become ready"
            tail -n 40 "$WD/receiver.log"
            exit 1
          fi
          echo "receiver is ready"

          echo "---- setting up cfuser policy routing (bypass VPN for cloudflared) ----"
          CF_MODE="plain"
          if sudo useradd -r -s /usr/sbin/nologin cfuser 2>/dev/null || id cfuser >/dev/null 2>&1; then
            if ! grep -q "^100 cfroute" /etc/iproute2/rt_tables 2>/dev/null; then
              echo "100 cfroute" | sudo tee -a /etc/iproute2/rt_tables >/dev/null
            fi
            CFUID=$(id -u cfuser)
            if [ -n "${ORIG_GW:-}" ] && [ -n "${ORIG_IF:-}" ]; then
              sudo ip route replace default via "$ORIG_GW" dev "$ORIG_IF" table cfroute 2>/dev/null
              sudo ip rule add uidrange "$CFUID-$CFUID" lookup cfroute priority 100 2>/dev/null \
                || sudo ip rule add uidrange "$CFUID-$CFUID" table cfroute priority 100 2>/dev/null
              if ip rule show | grep -q "priority 100"; then
                CF_MODE="isolated"
              fi
            fi
          fi
          echo "CF_MODE=$CF_MODE" >> "$GITHUB_ENV"
          echo "Using CF_MODE=$CF_MODE"

          echo "---- starting cloudflared tunnel ----"
          CF_TUNNEL_TOKEN="$CF_TUNNEL_TOKEN" CF_MODE="$CF_MODE" bash "$WD/start_cf.sh"

      - name: Run Task and Handoff Loop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          set +e
          WD="${{ github.workspace }}"
          cd "$WD"

          DURATION="${{ github.event.inputs.duration_minutes }}"
          TRIGGER="${{ github.event.inputs.trigger_minute }}"
          [ -z "$DURATION" ] && DURATION=120
          [ -z "$TRIGGER" ] && TRIGGER=110

          DURATION_SEC=$((DURATION * 60))
          TRIGGER_SEC=$((TRIGGER * 60))
          ELAPSED=0
          TRIGGERED=0
          RECV_FAILS=0
          TUNNEL_FAILS=0

          fire_handoff() {
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
              -d "{\"event_type\":\"${OTHER_EVENT}\"}")
            echo "handoff dispatch HTTP $CODE"
            TRIGGERED=1
          }

          while [ "$ELAPSED" -lt "$DURATION_SEC" ]; do
            sleep 55
            ELAPSED=$((ELAPSED + 55))

            if [ "$TRIGGERED" -eq 0 ] && [ "$ELAPSED" -ge "$TRIGGER_SEC" ]; then
              echo "---- trigger minute reached, dispatching $OTHER_EVENT ----"
              fire_handoff
            fi

            if ! ip link show tun0 up >/dev/null 2>&1; then
              echo "FATAL: tun0 disappeared — failing over"
              [ "$TRIGGERED" -eq 0 ] && fire_handoff
              exit 1
            fi

            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:8081/fapi/v1/ping)
            if [ "$CODE" != "200" ]; then
              RECV_FAILS=$((RECV_FAILS+1))
              echo "receiver check failed ($RECV_FAILS/3), restarting receiver"
              sudo pkill -f receiver.py 2>/dev/null || true
              sleep 1
              nohup python3 "$WD/receiver.py" > "$WD/receiver.log" 2>&1 &
              if [ "$RECV_FAILS" -ge 3 ]; then
                echo "FATAL: receiver did not recover — failing over"
                [ "$TRIGGERED" -eq 0 ] && fire_handoff
                exit 1
              fi
            else
              RECV_FAILS=0
            fi

            HEADER=$(curl -s -D - -o /dev/null --max-time 10 "$PUBLIC_URL/fapi/v1/ping" 2>/dev/null)
            if echo "$HEADER" | grep -qi "^x-via-receiver: 1"; then
              TUNNEL_FAILS=0
            else
              TUNNEL_FAILS=$((TUNNEL_FAILS+1))
              echo "public URL check failed ($TUNNEL_FAILS/3)"
              if [ "$TUNNEL_FAILS" -ge 3 ]; then
                echo "restarting cloudflared tunnel"
                CF_TUNNEL_TOKEN="$CF_TUNNEL_TOKEN" CF_MODE="${CF_MODE:-plain}" bash "$WD/start_cf.sh"
                TUNNEL_FAILS=0
              fi
            fi

            MIN=$((ELAPSED / 60))
            echo "status: minute $MIN/$DURATION | recv_fails=$RECV_FAILS | tunnel_fails=$TUNNEL_FAILS | triggered=$TRIGGERED"
          done

          if [ "$TRIGGERED" -eq 0 ]; then
            echo "---- duration elapsed without trigger firing, dispatching now ----"
            fire_handoff
          fi

          echo "Run complete."

      - name: Debug on failure
        if: failure()
        run: |
          WD="${{ github.workspace }}"
          echo "---- ip route ----"; ip route || true
          echo "---- ip rule ----"; ip rule || true
          echo "---- resolv.conf ----"; cat /etc/resolv.conf || true
          echo "---- vpn.log ----"; sudo cat "$WD/vpn.log" 2>/dev/null || true
          echo "---- receiver.log ----"; tail -n 40 "$WD/receiver.log" 2>/dev/null || true
          echo "---- cloudflared.log ----"; tail -n 40 "$WD/cloudflared.log" 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          WD="${{ github.workspace }}"
          pkill -f "cfd tunnel" 2>/dev/null || true
          pkill -f receiver.py 2>/dev/null || true
          sudo ip rule del priority 100 2>/dev/null || true
          sudo ip route flush table cfroute 2>/dev/null || true
          sudo pkill openvpn 2>/dev/null || true
          rm -f "$WD/pass.txt" "$WD/vpn.ovpn"
