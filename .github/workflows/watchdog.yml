name: Continuous VPN Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-heal:
    runs-on: ubuntu-22.04
    steps:
      - name: Check Tunnel Status and Revive
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -Eeuo pipefail
          URL="${PUBLIC_URL:-https://fapi.astiagbiance.dpdns.org}"
          URL="${URL%/}"

          echo "=== Probing public endpoint: ${URL}/fapi/v1/ping ==="

          # --- Method 1: probe the public URL directly (same check the main loop uses) ---
          HEALTHY=0
          RESP_HEADERS=$(curl -s -D - -o /dev/null --max-time 15 "$URL/fapi/v1/ping" 2>/dev/null || true)

          if echo "$RESP_HEADERS" | tr -d '\r' | grep -qi '^x-via-receiver: 1'; then
            echo "✅ Public URL is live and routed through receiver. No action needed."
            HEALTHY=1
          fi

          # --- Method 2: fallback — check the __status endpoint if available ---
          if [ "$HEALTHY" = "0" ] && [ -n "${{ secrets.WORKER_URL }}" ]; then
            echo "⚠️  Public probe failed. Checking __status endpoint..."
            STATUS=$(curl -s --max-time 10 "${{ secrets.WORKER_URL }}/__status" \
              -H "X-Secret: ${{ secrets.REGISTER_SECRET }}" || true)
            echo "Status response:"
            echo "$STATUS"

            # Accept any non-empty status that contains a known domain indicator
            if echo "$STATUS" | grep -qiE '(cloudflare|dpdns|tunnel|connected|active)'; then
              echo "✅ __status reports an active tunnel. No action needed."
              HEALTHY=1
            fi
          fi

          # --- Trigger Instance A if both checks failed ---
          if [ "$HEALTHY" = "0" ]; then
            echo "🚨 Tunnel is DOWN! Triggering Instance A..."

            # Guard: don't stack triggers if a run is already in progress
            RUNNING=$(curl -s --max-time 10 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows" \
              | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              for w in data.get('workflows', []):
                  if 'Instance A' in w.get('name', ''):
                      print(w['id'])
                      break
          except: pass
          " || true)

            if [ -n "$RUNNING" ]; then
              IN_PROGRESS=$(curl -s --max-time 10 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${RUNNING}/runs?status=in_progress&per_page=1" \
                | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              print(data.get('total_count', 0))
          except: print(0)
          " || echo "0")

              if [ "$IN_PROGRESS" -gt 0 ] 2>/dev/null; then
                echo "⏳ Instance A already has $IN_PROGRESS run(s) in progress. Skipping trigger to avoid stacking."
                exit 0
              fi
            fi

            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d '{"event_type":"trigger_a"}' || true)
            echo "Trigger A result: HTTP $CODE"

            if [ "$CODE" != "204" ]; then
              echo "⚠️  Trigger may have failed (expected 204, got $CODE)"
            fi
          fi
