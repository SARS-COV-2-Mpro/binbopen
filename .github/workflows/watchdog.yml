name: Continuous VPN Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  auto-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Check Tunnel Status and Revive
        run: |
          set -Eeuo pipefail
          STATUS=$(curl -s --max-time 10 "${{ secrets.WORKER_URL }}/__status" -H "X-Secret: ${{ secrets.REGISTER_SECRET }}" || true)
          echo "Current Status:"
          echo "$STATUS"

          # Check if any valid trycloudflare URL exists in the status
          if echo "$STATUS" | grep -q "trycloudflare.com"; then
            echo "✅ At least one active tunnel found. No action needed."
          else
            echo "🚨 No active tunnel registered! Auto-restarting Instance A..."
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d '{"event_type":"trigger_a"}' || true)
            echo "Trigger A result: HTTP $CODE"
          fi
