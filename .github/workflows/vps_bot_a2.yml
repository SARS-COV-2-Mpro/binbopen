name: Continuous VPN Worker - Instance A2

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_a2]

jobs:
  run-instance-a2:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download cloudflared (before VPN)
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR ❌❌❌"; echo "Step: Download cloudflared"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"' ERR

          echo "--- Downloading cloudflared binary (before VPN, fast network) ---"
          curl -fsSL --retry 5 --retry-delay 3 --connect-timeout 15 --max-time 120 \
            -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version || { echo "❌ cloudflared binary not working"; exit 1; }
          echo "✅ cloudflared installed and verified"

      - name: Validate Required Secrets
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR ❌❌❌"; echo "Step: Validate Required Secrets"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"' ERR

          MISSING=0

          check_secret() {
            NAME="$1"
            VALUE="$2"
            if [ -z "$VALUE" ]; then
              echo "❌ MISSING: $NAME is empty or not set"
              MISSING=1
            else
              echo "✅ OK: $NAME is set (length: ${#VALUE} chars)"
            fi
          }

          check_secret "VPN_USERNAME" "${{ secrets.VPN_USERNAME }}"
          check_secret "VPN_PASSWORD" "${{ secrets.VPN_PASSWORD }}"
          check_secret "VPN_CONFIG" "${{ secrets.VPN_CONFIG }}"
          check_secret "GH_TOKEN" "${{ secrets.GH_TOKEN }}"
          check_secret "WORKER_URL" "${{ secrets.WORKER_URL }}"
          check_secret "REGISTER_SECRET" "${{ secrets.REGISTER_SECRET }}"

          if [ "$MISSING" -eq 1 ]; then
            echo "❌ One or more required secrets are missing. Aborting."
            exit 1
          fi
          echo "✅ All required secrets are present."

      - name: Install OpenVPN
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR ❌❌❌"; echo "Step: Install OpenVPN"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"' ERR

          echo "--- Updating apt package lists ---"
          if ! sudo apt-get update; then
            echo "❌ apt-get update failed"
            exit 1
          fi
          echo "--- Installing openvpn package ---"
          if ! sudo apt-get install -y openvpn; then
            echo "❌ apt-get install openvpn failed"
            exit 1
          fi
          openvpn --version

      - name: Setup VPN Credentials
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR ❌❌❌"; echo "Step: Setup VPN Credentials"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"' ERR

          echo "--- Creating credentials file ---"
          echo "${{ secrets.VPN_USERNAME }}" > pass.txt
          echo "${{ secrets.VPN_PASSWORD }}" >> pass.txt
          chmod 600 pass.txt

          if [ ! -s pass.txt ]; then
            echo "❌ pass.txt is empty after creation — VPN_USERNAME/VPN_PASSWORD secrets may be blank"
            exit 1
          fi
          echo "✅ pass.txt created ($(wc -l < pass.txt) lines)"

          echo "--- Writing VPN config ---"
          echo "${{ secrets.VPN_CONFIG }}" > config.ovpn

          if [ ! -s config.ovpn ]; then
            echo "❌ config.ovpn is empty after creation — VPN_CONFIG secret may be blank"
            exit 1
          fi
          echo "✅ config.ovpn created ($(wc -l < config.ovpn) lines)"

          echo "--- Removing deprecated options ---"
          sed -i '/persist-key/d' config.ovpn
          sed -i '/persist-tun/d' config.ovpn
          echo "✅ Removed persist-key and persist-tun"

          echo "--- Fixing auth-user-pass line ---"
          sed -i '/auth-user-pass/d' config.ovpn
          echo "auth-user-pass pass.txt" >> config.ovpn
          echo "✅ auth-user-pass fixed"

          echo "--- Fixing cipher negotiation (OpenVPN 2.6+ requirement) ---"
          echo "data-ciphers AES-128-CBC" >> config.ovpn
          echo "data-ciphers-fallback AES-128-CBC" >> config.ovpn
          echo "✅ data-ciphers added"

      - name: Check IP Before VPN
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR ❌❌❌"; echo "Step: Check IP Before VPN"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"' ERR

          echo "GitHub Runner IP (Before VPN):"
          set +e
          BEFORE_IP=$(curl -s --connect-timeout 10 --max-time 20 https://ifconfig.me 2>/tmp/before_ip_err.log)
          BEFORE_EXIT=$?
          set -e
          if [ $BEFORE_EXIT -ne 0 ]; then
            echo "⚠️ ifconfig.me unreachable (non-fatal) — curl exit code $BEFORE_EXIT"
          else
            echo "$BEFORE_IP"
          fi

      - name: Start VPN (retries until the previous instance releases the session)
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR ❌❌❌"; echo "Step: Start VPN"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"' ERR

          echo "--- Enabling TUN device ---"
          sudo modprobe tun
          ls /dev/net/tun
          echo "✅ TUN device is available"

          MAX_ATTEMPTS=80
          TUN_UP=0

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "==============================="
            echo "🔌 VPN attempt $attempt/$MAX_ATTEMPTS at $(date -u +"%H:%M:%S")"

            sudo pkill -x openvpn || true
            sleep 1
            sudo rm -f /tmp/vpn.log
            sudo touch /tmp/vpn.log
            sudo chmod 777 /tmp/vpn.log

            sudo openvpn \
              --config config.ovpn \
              --auth-user-pass pass.txt \
              --verb 3 \
              --log /tmp/vpn.log &

            for i in {1..45}; do
              sleep 1
              if ip link show tun0 > /dev/null 2>&1; then
                echo "✅ tun0 appeared at second $i"
                TUN_UP=1
                break
              fi
              if ! pgrep -x openvpn > /dev/null; then
                echo "⚠️ OpenVPN exited at second $i"
                break
              fi
            done

            if [ "$TUN_UP" -eq 1 ]; then
              break
            fi

            echo "--- Last VPN log lines ---"
            sudo tail -n 8 /tmp/vpn.log || true
            echo "⏳ Not connected (session probably still held). Retrying in 15s..."
            sudo pkill -x openvpn || true
            sleep 15
          done

          echo "==============================="
          echo "--- VPN Log ---"
          sudo tail -n 40 /tmp/vpn.log || true
          echo "==============================="

          if [ "$TUN_UP" -eq 0 ]; then
            echo "❌ VPN never connected after $MAX_ATTEMPTS attempts"
            exit 1
          fi

          if pgrep -x openvpn > /dev/null; then
            echo "✅ OpenVPN process is RUNNING"
          else
            echo "❌ OpenVPN process DIED after tun0 came up (unusual)"
            exit 1
          fi

      - name: Verify VPN Connection
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR ❌❌❌"; echo "Step: Verify VPN Connection"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"' ERR

          echo "Exit IP (After VPN):"
          set +e
          CURRENT_IP=$(curl -s --connect-timeout 10 --max-time 20 https://ifconfig.me 2>/tmp/after_ip_err.log)
          IP_EXIT=$?
          set -e
          if [ $IP_EXIT -ne 0 ]; then
            echo "⚠️ ifconfig.me check failed — curl exit code $IP_EXIT: $(cat /tmp/after_ip_err.log 2>/dev/null)"
            CURRENT_IP="UNKNOWN"
          else
            echo "$CURRENT_IP"
          fi

          echo "VPN Tunnel Interface (tun0):"
          if ip addr show tun0 > /dev/null 2>&1; then
            ip addr show tun0
            echo "✅ tun0 is UP"
          else
            echo "❌ tun0 is NOT found"
            exit 1
          fi

          echo "Routing Table:"
          ip route

      - name: Check Exit IP Gate
        run: |
          EXPECTED="${{ secrets.EXPECTED_EXIT_IP }}"
          if [ -z "$EXPECTED" ]; then
            echo "⚠️ EXPECTED_EXIT_IP not set — gate skipped."
          else
            ACTUAL=$(curl -s --max-time 10 https://ifconfig.me || echo "UNKNOWN")
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "❌ Exit IP mismatch"
              exit 1
            fi
            echo "✅ Exit IP matches"
          fi

      - name: Start Receiver
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR ❌❌❌"; echo "Step: Start Receiver"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"' ERR

          python3 --version

          echo "--- Starting receiver.py (unbuffered) on port 8081 ---"
          nohup python3 -u receiver.py > /tmp/receiver.log 2>&1 &
          RECEIVER_PID=$!
          echo "✅ Receiver PID: $RECEIVER_PID"

          sleep 5

          sudo ss -tlnp | grep 8081 || echo "⚠️ Port 8081 not found in ss output (non-fatal, will verify with curl next)"

          echo "--- Receiver Log (first 5 seconds) ---"
          cat /tmp/receiver.log

          if ! pgrep -f receiver.py > /dev/null; then
            echo "❌ receiver.py process is NOT running"
            cat /tmp/receiver.log
            exit 1
          fi
          echo "✅ receiver.py process is alive"

          set +e
          HTTP_CODE=$(curl -s -o /tmp/curl_response.txt -w "%{http_code}" --connect-timeout 5 --max-time 10 http://localhost:8081/ 2>/tmp/receiver_curl_err.log)
          CURL_EXIT=$?
          set -e

          if [ $CURL_EXIT -ne 0 ]; then
            echo "❌ curl itself failed (exit code $CURL_EXIT): $(cat /tmp/receiver_curl_err.log 2>/dev/null)"
            cat /tmp/receiver.log
            exit 1
          fi

          echo "HTTP response code: $HTTP_CODE"
          if [ "$HTTP_CODE" == "000" ]; then
            echo "❌ Receiver is NOT reachable at all (connection failed)"
            cat /tmp/receiver.log
            exit 1
          else
            echo "✅ Receiver responded with HTTP $HTTP_CODE (server is up)"
          fi

      - name: Start Cloudflared Quick Tunnel and Register
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR ❌❌❌"; echo "Step: Start Cloudflared"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"' ERR

          cloudflared --version || { echo "❌ cloudflared binary not working"; exit 1; }

          echo "--- Starting cloudflared quick tunnel ---"
          nohup cloudflared tunnel --no-autoupdate --protocol http2 --url http://localhost:8081 > /tmp/cloudflared.log 2>&1 &
          CF_PID=$!
          echo "✅ cloudflared PID: $CF_PID"

          echo "--- Waiting for tunnel URL ---"
          URL=""
          for i in {1..30}; do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log | grep -v '^https://api\.' | head -1 || true)
            if [ -n "$URL" ]; then
              echo "✅ Tunnel URL found: $URL"
              break
            fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "❌ No tunnel URL found after 60 seconds"
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo "$URL" > /tmp/tunnel_url.txt

          echo "--- Verifying public chain (tunnel -> receiver -> VPN -> Binance) ---"
          OK=0
          for i in {1..20}; do
            set +e
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 15 "$URL/fapi/v1/ping" 2>/tmp/chain_err.log)
            CHAIN_EXIT=$?
            set -e
            echo "Public chain test $i: HTTP $CODE (curl exit $CHAIN_EXIT)"
            if [ "$CODE" == "200" ]; then OK=1; break; fi
            sleep 3
          done

          if [ "$OK" != "1" ]; then
            echo "❌ Public chain never returned 200"
            cat /tmp/cloudflared.log
            cat /tmp/receiver.log
            exit 1
          fi
          echo "✅ Public chain works"

          echo "--- Registering with tunnel-proxy ---"
          RESP=""
          for n in 1 2 3; do
            set +e
            RESP=$(curl -s --connect-timeout 10 --max-time 15 -X POST "${{ secrets.WORKER_URL }}/__register" \
              -H "X-Secret: ${{ secrets.REGISTER_SECRET }}" \
              -H "Content-Type: application/json" \
              -d "{\"instance\":\"A2\",\"url\":\"$URL\"}" 2>/tmp/register_err.log)
            REG_EXIT=$?
            set -e
            echo "Register attempt $n: '$RESP' (curl exit $REG_EXIT)"
            if [ "$RESP" == "ok" ]; then break; fi
            sleep 3
          done

          if [ "$RESP" != "ok" ]; then
            echo "❌ Registration failed"
            cat /tmp/register_err.log 2>/dev/null || true
            exit 1
          fi
          echo "✅ Registered with tunnel-proxy"

      - name: Run Task and Ping Pong Loop (Instance A2)
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR (uncaught) ❌❌❌"; echo "Step: Run Task and Ping Pong Loop"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"; echo "Timestamp (UTC): $(date -u +"%Y-%m-%dT%H:%M:%SZ")"' ERR

          DURATION_MINUTES=299
          TRIGGER_MINUTE=295

          echo "==============================="
          echo "✅ VPN, Receiver and Cloudflared are ACTIVE"
          echo "⏱ Running ${DURATION_MINUTES} minutes. At minute ${TRIGGER_MINUTE}, Instance A is triggered."
          echo "⏱ At minute ${DURATION_MINUTES}, this instance deregisters and disconnects the VPN."
          echo "==============================="

          trigger_a() {
            for t in 1 2 3; do
              set +e
              CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST --connect-timeout 10 --max-time 15 \
                -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/${{ github.repository }}/dispatches \
                -d '{"event_type": "trigger_a"}')
              set -e
              echo "🔄 trigger_a attempt $t: HTTP $CODE"
              if [ "$CODE" == "204" ]; then return 0; fi
              sleep 3
            done
            return 1
          }

          shutdown_instance() {
            echo "==============================="
            echo "🛑 Shutting down: deregister, stop tunnel, stop receiver, stop VPN"
            set +e
            if [ -f /tmp/tunnel_url.txt ]; then
              URL=$(cat /tmp/tunnel_url.txt)
              curl -s --max-time 15 -X POST "${{ secrets.WORKER_URL }}/__deregister" \
                -H "X-Secret: ${{ secrets.REGISTER_SECRET }}" \
                -H "Content-Type: application/json" \
                -d "{\"instance\":\"A2\",\"url\":\"$URL\"}"
              echo ""
            fi
            pkill -f "cloudflared tunnel"
            pkill -f receiver.py
            sudo pkill -TERM openvpn
            for w in {1..15}; do
              if ! pgrep -x openvpn > /dev/null; then break; fi
              sleep 1
            done
            sudo pkill -KILL openvpn
            set -e
            echo "✅ Shutdown complete at $(date -u +"%H:%M:%S")"
            echo "==============================="
          }

          OTHER_TRIGGERED=0
          FAILURE=0

          for i in $(seq 1 $DURATION_MINUTES); do
            set +e
            CURRENT_IP=$(curl -s --connect-timeout 5 --max-time 10 https://ifconfig.me 2>/tmp/loop_ip_err.log)
            IP_EXIT=$?
            set -e
            if [ $IP_EXIT -ne 0 ]; then
              CURRENT_IP="UNKNOWN(curl_exit=$IP_EXIT)"
            fi

            if pgrep -x openvpn > /dev/null; then VPN_STATUS="ACTIVE"; else VPN_STATUS="DEAD"; fi
            if pgrep -f receiver.py > /dev/null; then RECEIVER_STATUS="ACTIVE"; else RECEIVER_STATUS="DEAD"; fi
            if pgrep -f "cloudflared tunnel" > /dev/null; then CF_STATUS="ACTIVE"; else CF_STATUS="DEAD"; fi

            echo "✅ [$(date -u +"%H:%M:%S")] Minute $i/$DURATION_MINUTES | VPN: $VPN_STATUS | Receiver: $RECEIVER_STATUS | Cloudflared: $CF_STATUS | IP: $CURRENT_IP"

            if [ "$i" -ge "$TRIGGER_MINUTE" ] && [ "$OTHER_TRIGGERED" -eq 0 ]; then
              echo "⏱ Minute $i — triggering Instance A so it is ready to take over"
              if trigger_a; then OTHER_TRIGGERED=1; fi
            fi

            if [ "$VPN_STATUS" == "DEAD" ] || [ "$RECEIVER_STATUS" == "DEAD" ] || [ "$CF_STATUS" == "DEAD" ]; then
              echo "❌ Something died at minute $i. Dumping logs..."
              sudo tail -n 40 /tmp/vpn.log || true
              tail -n 40 /tmp/receiver.log || true
              tail -n 40 /tmp/cloudflared.log || true
              if [ "$OTHER_TRIGGERED" -eq 0 ]; then
                echo "🔄 Triggering emergency A start before exiting..."
                if trigger_a; then OTHER_TRIGGERED=1; fi
              fi
              FAILURE=1
              break
            fi

            sleep 60
          done

          shutdown_instance

          if [ "$FAILURE" == "1" ]; then
            echo "❌ Instance A2 exiting with FAILURE (component died early at minute $i)"
            exit 1
          fi

          if [ "$OTHER_TRIGGERED" -eq 0 ]; then
            echo "⚠️ A was never triggered successfully — last chance trigger"
            trigger_a || echo "❌ Could not trigger A. The chain is broken. Start A manually."
          fi

          echo "⏱ ${DURATION_MINUTES} minutes reached — Instance A2 finished. A takes over."

      - name: Deregister from tunnel-proxy (safety)
        if: always()
        run: |
          if [ -f /tmp/tunnel_url.txt ]; then
            URL=$(cat /tmp/tunnel_url.txt)
            curl -s --max-time 15 -X POST "${{ secrets.WORKER_URL }}/__deregister" \
              -H "X-Secret: ${{ secrets.REGISTER_SECRET }}" \
              -H "Content-Type: application/json" \
              -d "{\"instance\":\"A2\",\"url\":\"$URL\"}" || true
            echo "✅ Deregister attempted"
          fi
