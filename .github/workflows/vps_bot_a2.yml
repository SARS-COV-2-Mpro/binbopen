name: VPS Bot A2

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_a2]

permissions:
  contents: read

env:
  INSTANCE_NAME: A2
  OTHER_EVENT: trigger_a
  RECEIVER_PORT: "8081"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download cloudflared (before VPN)
        run: |
          curl -fsSL --retry 5 --retry-delay 3 --connect-timeout 15 --max-time 120 \
            -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Validate Required Secrets
        env:
          S_VPN_CONFIG: ${{ secrets.VPN_CONFIG }}
          S_VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
          S_VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
          S_GH_TOKEN: ${{ secrets.GH_TOKEN }}
          S_WORKER_URL: ${{ secrets.WORKER_URL }}
          S_REGISTER_SECRET: ${{ secrets.REGISTER_SECRET }}
        run: |
          missing=0
          for n in VPN_CONFIG VPN_USERNAME VPN_PASSWORD GH_TOKEN WORKER_URL REGISTER_SECRET; do
            v="S_$n"
            if [ -z "${!v}" ]; then
              echo "MISSING SECRET: $n"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then exit 1; fi
          echo "All required secrets are present."

      - name: Install OpenVPN
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn
          python3 -m pip install --quiet requests || true

      - name: Setup VPN Credentials
        run: |
          set -Eeuo pipefail
          echo "${{ secrets.VPN_CONFIG }}" > /tmp/vpn.ovpn
          echo "${{ secrets.VPN_USERNAME }}" > /tmp/auth.txt
          echo "${{ secrets.VPN_PASSWORD }}" >> /tmp/auth.txt
          chmod 600 /tmp/vpn.ovpn /tmp/auth.txt
          echo "VPN files written."

      - name: Check IP Before VPN
        run: |
          echo "IP before VPN: $(curl -s --max-time 15 https://api.ipify.org || echo unknown)"

      - name: Start VPN
        run: |
          set -Eeuo pipefail
          trap 'echo "VPN START FAILED. Last log lines:"; sudo tail -n 50 /tmp/vpn.log || true' ERR

          sudo rm -f /tmp/vpn.log
          sudo openvpn --config /tmp/vpn.ovpn \
            --auth-user-pass /tmp/auth.txt \
            --daemon \
            --log /tmp/vpn.log \
            --writepid /tmp/openvpn.pid

          for i in $(seq 1 60); do
            if sudo grep -q "AUTH_FAILED" /tmp/vpn.log 2>/dev/null; then
              echo "AUTH_FAILED - another VPN session may still be alive. Wait 5-15 min and check old runs."
              exit 1
            fi
            if sudo grep -q "Initialization Sequence Completed" /tmp/vpn.log 2>/dev/null; then
              echo "VPN initialized after ~$((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "VPN did not initialize within 120s"
          exit 1

      - name: Verify VPN Connection
        run: |
          set -Eeuo pipefail
          ip addr show tun0
          echo "Exit IP: $(curl -s --max-time 20 --retry 3 https://api.ipify.org)"

      - name: Check Exit IP Gate
        env:
          EXPECTED_EXIT_IP: ${{ secrets.EXPECTED_EXIT_IP }}
        run: |
          set -Eeuo pipefail
          EXIT_IP=$(curl -s --max-time 20 --retry 3 https://api.ipify.org || true)
          echo "Current exit IP: $EXIT_IP"
          if [ -z "${EXPECTED_EXIT_IP:-}" ]; then
            echo "EXPECTED_EXIT_IP not set - gate skipped."
            exit 0
          fi
          if [ "$EXIT_IP" != "$EXPECTED_EXIT_IP" ]; then
            echo "EXIT IP MISMATCH: got '$EXIT_IP', expected '$EXPECTED_EXIT_IP'"
            exit 1
          fi
          echo "Exit IP matches expected."

      - name: Start Receiver
        run: |
          set -Eeuo pipefail
          setsid nohup python3 receiver.py > /tmp/receiver.log 2>&1 &
          sleep 3
          if ! pgrep -f "receiver.py" > /dev/null; then
            echo "receiver.py died on start:"
            cat /tmp/receiver.log
            exit 1
          fi
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://localhost:${RECEIVER_PORT}/fapi/v1/ping" || true)
            echo "local /fapi/v1/ping attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then break; fi
            sleep 2
          done
          echo "--- receiver log ---"
          tail -n 20 /tmp/receiver.log || true

      - name: Start Cloudflared Quick Tunnel and Register
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          REGISTER_SECRET: ${{ secrets.REGISTER_SECRET }}
        run: |
          set -Eeuo pipefail
          cloudflared --version

          setsid nohup cloudflared tunnel --no-autoupdate --protocol http2 \
            --url "http://localhost:${RECEIVER_PORT}" > /tmp/cloudflared.log 2>&1 &

          URL=""
          for i in $(seq 1 45); do
            URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log 2>/dev/null | grep -v '^https://api\.' | head -n1 || true)
            if [ -n "$URL" ]; then break; fi
            if ! pgrep -f "cloudflared tunnel" > /dev/null; then
              echo "cloudflared died:"
              cat /tmp/cloudflared.log
              exit 1
            fi
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "No tunnel URL found:"
            cat /tmp/cloudflared.log
            exit 1
          fi
          echo "$URL" > /tmp/tunnel_url.txt
          echo "Tunnel URL: $URL"

          OK=0
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/ping.out -w "%{http_code}" --max-time 15 "$URL/fapi/v1/ping" || true)
            echo "public ping attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then OK=1; break; fi
            sleep 3
          done
          if [ "$OK" -ne 1 ]; then
            echo "Public chain test failed (last body below)."
            cat /tmp/ping.out || true
            echo "If 403/451: Binance blocks this VPN IP. Use another VPN server."
            tail -n 30 /tmp/cloudflared.log || true
            tail -n 30 /tmp/receiver.log || true
            exit 1
          fi

          REG=0
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/reg.out -w "%{http_code}" --max-time 20 \
              -X POST "$WORKER_URL/__register" \
              -H "X-Secret: $REGISTER_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"instance\":\"${INSTANCE_NAME}\",\"url\":\"$URL\"}" || true)
            echo "register attempt $i: HTTP $CODE $(cat /tmp/reg.out 2>/dev/null || true)"
            if [ "$CODE" = "200" ]; then REG=1; break; fi
            sleep 3
          done
          if [ "$REG" -ne 1 ]; then
            echo "Registration failed."
            exit 1
          fi
          echo "Registered ${INSTANCE_NAME} -> $URL"

      - name: Run Task and Ping Pong Loop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          START=$(date +%s)
          TOTAL=$((130*60))
          TRIGGER_AT=$((100*60))
          TRIGGERED=0

          trigger_other() {
            for i in 1 2 3; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
                -X POST "https://api.github.com/repos/${REPO}/dispatches" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -d "{\"event_type\":\"${OTHER_EVENT}\"}" || true)
              echo "trigger ${OTHER_EVENT} attempt $i: HTTP $CODE"
              if [ "$CODE" = "204" ]; then return 0; fi
              sleep 3
            done
            return 1
          }

          N=0
          while true; do
            ELAPSED=$(( $(date +%s) - START ))
            if [ "$ELAPSED" -ge "$TOTAL" ]; then
              echo "Reached 130 minutes. Finishing."
              break
            fi

            if [ "$TRIGGERED" -eq 0 ] && [ "$ELAPSED" -ge "$TRIGGER_AT" ]; then
              echo "Minute 100 reached - triggering ${OTHER_EVENT}"
              if trigger_other; then TRIGGERED=1; fi
            fi

            PROBLEM=""
            ip link show tun0 > /dev/null 2>&1 || PROBLEM="tun0 down"
            pgrep -x openvpn > /dev/null || PROBLEM="openvpn died"
            pgrep -f "receiver.py" > /dev/null || PROBLEM="receiver died"
            pgrep -f "cloudflared tunnel" > /dev/null || PROBLEM="cloudflared died"

            if [ -n "$PROBLEM" ]; then
              echo "PROBLEM: $PROBLEM at $((ELAPSED/60)) min - emergency handover"
              if [ "$TRIGGERED" -eq 0 ]; then trigger_other && TRIGGERED=1; fi
              echo "--- vpn log ---";        sudo tail -n 20 /tmp/vpn.log || true
              echo "--- receiver log ---";   tail -n 20 /tmp/receiver.log || true
              echo "--- cloudflared log ---"; tail -n 20 /tmp/cloudflared.log || true
              exit 1
            fi

            N=$((N+1))
            if [ $((N % 10)) -eq 1 ]; then
              echo "[$(date -u +%H:%M:%S)] ${INSTANCE_NAME} alive | elapsed $((ELAPSED/60)) min | VPN: ACTIVE | triggered=$TRIGGERED"
            fi
            sleep 30
          done

      - name: Deregister
        if: always()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          REGISTER_SECRET: ${{ secrets.REGISTER_SECRET }}
        run: |
          if [ -f /tmp/tunnel_url.txt ]; then
            URL=$(cat /tmp/tunnel_url.txt)
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
              -X POST "$WORKER_URL/__deregister" \
              -H "X-Secret: $REGISTER_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"instance\":\"${INSTANCE_NAME}\",\"url\":\"$URL\"}" || true)
            echo "deregister: HTTP $CODE"
          else
            echo "No tunnel URL file - nothing to deregister."
          fi
          pkill -f "cloudflared tunnel" || true
          pkill -f "receiver.py" || true
          sudo pkill openvpn || true
