name: Continuous VPN Worker

on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart_vpn]

jobs:
  run-vpn-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn
          echo "--- OpenVPN Version ---"
          openvpn --version

      - name: Setup VPN Credentials
        run: |
          echo "--- Creating credentials file ---"
          echo "${{ secrets.VPN_USERNAME }}" > pass.txt
          echo "${{ secrets.VPN_PASSWORD }}" >> pass.txt
          chmod 600 pass.txt
          echo "✅ pass.txt created"

          echo "--- Writing VPN config ---"
          echo "${{ secrets.VPN_CONFIG }}" > config.ovpn
          echo "✅ config.ovpn created"

          echo "--- Removing deprecated options ---"
          sed -i '/persist-key/d' config.ovpn
          sed -i '/persist-tun/d' config.ovpn
          echo "✅ Removed persist-key and persist-tun"

          echo "--- Fixing auth-user-pass line ---"
          sed -i '/auth-user-pass/d' config.ovpn
          echo "auth-user-pass pass.txt" >> config.ovpn
          echo "✅ auth-user-pass fixed"

          echo "--- Fixing cipher negotiation (OpenVPN 2.6+ requirement) ---"
          echo "data-ciphers AES-128-CBC" >> config.ovpn
          echo "data-ciphers-fallback AES-128-CBC" >> config.ovpn
          echo "✅ data-ciphers added"

          echo "==============================="
          echo "--- Final config.ovpn content ---"
          cat config.ovpn
          echo "==============================="

      - name: Check IP Before VPN
        run: |
          echo "==============================="
          echo "GitHub Runner IP (Before VPN):"
          curl -s https://ifconfig.me
          echo ""
          echo "==============================="

      - name: Start VPN
        run: |
          echo "--- Enabling TUN device ---"
          sudo modprobe tun
          ls /dev/net/tun
          echo "✅ TUN device is available"

          echo "--- Creating log file with open permissions ---"
          sudo touch /tmp/vpn.log
          sudo chmod 777 /tmp/vpn.log
          echo "✅ Log file created"

          echo "--- Starting OpenVPN in FOREGROUND to see full output ---"
          sudo openvpn \
            --config config.ovpn \
            --auth-user-pass pass.txt \
            --verb 6 \
            --log /tmp/vpn.log &

          VPN_PID=$!
          echo "✅ OpenVPN PID: $VPN_PID"

          echo "--- Waiting up to 60 seconds for tun0 to appear ---"
          for i in {1..60}; do
            sleep 1
            if ip link show tun0 > /dev/null 2>&1; then
              echo "✅ tun0 appeared at second $i"
              break
            fi
            echo "⏳ Second $i - waiting for tun0..."
          done

          echo "==============================="
          echo "--- Full VPN Log ---"
          sudo cat /tmp/vpn.log
          echo "==============================="

          echo "--- Checking tun0 ---"
          if ip link show tun0 > /dev/null 2>&1; then
            echo "✅ tun0 is UP"
          else
            echo "❌ tun0 NEVER appeared - VPN failed to connect"
            echo "--- OpenVPN Process Status ---"
            ps aux | grep openvpn
            echo "--- Check log above for AUTH_FAILED or TLS errors ---"
            exit 1
          fi

          echo "--- Checking OpenVPN process ---"
          if pgrep openvpn > /dev/null; then
            echo "✅ OpenVPN process is RUNNING"
          else
            echo "❌ OpenVPN process DIED"
            exit 1
          fi

      - name: Verify VPN Connection
        run: |
          echo "==============================="
          echo "Exit IP (After VPN):"
          CURRENT_IP=$(curl -s https://ifconfig.me)
          echo "$CURRENT_IP"
          echo ""

          echo "==============================="
          echo "Location Details:"
          curl -s https://ipinfo.io/$CURRENT_IP
          echo ""

          echo "==============================="
          echo "VPN Tunnel Interface (tun0):"
          if ip addr show tun0 > /dev/null 2>&1; then
            ip addr show tun0
            echo "✅ tun0 is UP"
          else
            echo "❌ tun0 is NOT found"
            exit 1
          fi

          echo "==============================="
          echo "Routing Table:"
          ip route
          echo ""

          echo "==============================="
          echo "DNS Check:"
          cat /etc/resolv.conf
          echo ""

          echo "==============================="
          echo "--- Full VPN Log After Connection ---"
          sudo cat /tmp/vpn.log
          echo "==============================="

      - name: Start Receiver
        run: |
          echo "==============================="
          echo "--- Checking python3 availability ---"
          python3 --version
          echo "==============================="

          echo "--- Starting receiver.py (unbuffered) on port 8081 ---"
          nohup python3 -u receiver.py > /tmp/receiver.log 2>&1 &
          RECEIVER_PID=$!
          echo "✅ Receiver PID: $RECEIVER_PID"

          sleep 5

          echo "--- Checking if port 8081 is listening ---"
          sudo ss -tlnp | grep 8081 || echo "⚠️ Port 8081 not found in ss output"

          echo "--- Receiver Log (first 5 seconds) ---"
          cat /tmp/receiver.log
          echo "==============================="

          echo "--- Checking receiver process is alive ---"
          if ! pgrep -f receiver.py > /dev/null; then
            echo "❌ receiver.py process is NOT running"
            cat /tmp/receiver.log
            exit 1
          fi
          echo "✅ receiver.py process is alive"

          echo "--- Testing receiver with curl (verbose) ---"
          HTTP_CODE=$(curl -s -o /tmp/curl_response.txt -w "%{http_code}" http://localhost:8081/ --max-time 10)
          echo "HTTP response code: $HTTP_CODE"
          echo "--- Response body ---"
          cat /tmp/curl_response.txt
          echo ""
          echo "==============================="

          if [ "$HTTP_CODE" == "000" ]; then
            echo "❌ Receiver is NOT reachable at all (connection failed)"
            echo "--- Full Receiver Log ---"
            cat /tmp/receiver.log
            exit 1
          else
            echo "✅ Receiver responded with HTTP $HTTP_CODE (server is up)"
          fi

      - name: Start Ngrok Tunnel
        run: |
          echo "==============================="
          echo "--- Installing ngrok ---"
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update
          sudo apt install -y ngrok
          echo "✅ ngrok installed"

          echo "--- Configuring ngrok authtoken ---"
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}
          echo "✅ authtoken configured"

          echo "--- Starting ngrok tunnel on static dev domain ---"
          nohup ngrok http 8081 --domain=${{ secrets.NGROK_DOMAIN }} > /tmp/ngrok.log 2>&1 &
          NGROK_PID=$!
          echo "✅ ngrok PID: $NGROK_PID"

          sleep 8

          echo "--- Ngrok Log ---"
          cat /tmp/ngrok.log
          echo "==============================="

          echo "--- Ngrok Tunnel Status (API) ---"
          curl -s http://localhost:4040/api/tunnels
          echo ""
          echo "==============================="

          echo "✅ Your Binance Receiver URL: https://${{ secrets.NGROK_DOMAIN }}"
          echo "==============================="

          echo "--- Verifying public URL responds ---"
          PUBLIC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.NGROK_DOMAIN }}/)
          echo "Public URL responded with status: $PUBLIC_STATUS"
          if [ "$PUBLIC_STATUS" == "000" ]; then
            echo "❌ Ngrok tunnel is NOT reachable publicly"
            cat /tmp/ngrok.log
            exit 1
          else
            echo "✅ Ngrok tunnel is publicly reachable"
          fi

      - name: Run Task and Ping Pong Loop
        run: |
          echo "==============================="
          echo "✅ VPN is ACTIVE"
          echo "✅ Receiver is ACTIVE on port 8081"
          echo "✅ Ngrok tunnel is ACTIVE at https://${{ secrets.NGROK_DOMAIN }}"
          echo "⏱ Running for 5 hours and 50 minutes..."
          echo "==============================="

          (
            for i in {1..350}; do
              CURRENT_IP=$(curl -s https://ifconfig.me)

              if pgrep openvpn > /dev/null; then
                VPN_STATUS="ACTIVE"
              else
                VPN_STATUS="DEAD"
              fi

              if pgrep -f receiver.py > /dev/null; then
                RECEIVER_STATUS="ACTIVE"
              else
                RECEIVER_STATUS="DEAD"
              fi

              if pgrep ngrok > /dev/null; then
                NGROK_STATUS="ACTIVE"
              else
                NGROK_STATUS="DEAD"
              fi

              echo "✅ Minute $i/350 | VPN: $VPN_STATUS | Receiver: $RECEIVER_STATUS | Ngrok: $NGROK_STATUS | IP: $CURRENT_IP"

              if [ "$VPN_STATUS" == "DEAD" ] || [ "$RECEIVER_STATUS" == "DEAD" ] || [ "$NGROK_STATUS" == "DEAD" ]; then
                echo "❌ Something died. Dumping logs..."
                echo "--- VPN Log ---"
                sudo cat /tmp/vpn.log
                echo "--- Receiver Log ---"
                cat /tmp/receiver.log
                echo "--- Ngrok Log ---"
                cat /tmp/ngrok.log
                exit 1
              fi

              sleep 60
            done

            echo "==============================="
            echo "⏱ 5h 50min reached."
            echo "🔄 Triggering next job (Ping Pong)..."
            echo "==============================="

            curl -X POST \
              -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/dispatches \
              -d '{"event_type": "restart_vpn"}'

            echo "✅ Next job triggered successfully!"
            echo "🏓 Ping Pong cycle complete."
          ) &

          wait
