name: Continuous VPN Worker

on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart_vpn]

jobs:
  run-vpn-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate Required Secrets
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR ❌❌❌"; echo "Step: Validate Required Secrets"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"' ERR

          echo "==============================="
          echo "--- Validating required GitHub Secrets are present ---"
          echo "==============================="

          MISSING=0

          check_secret() {
            NAME="$1"
            VALUE="$2"
            if [ -z "$VALUE" ]; then
              echo "❌ MISSING: $NAME is empty or not set"
              MISSING=1
            else
              echo "✅ OK: $NAME is set (length: ${#VALUE} chars)"
            fi
          }

          check_secret "VPN_USERNAME" "${{ secrets.VPN_USERNAME }}"
          check_secret "VPN_PASSWORD" "${{ secrets.VPN_PASSWORD }}"
          check_secret "VPN_CONFIG" "${{ secrets.VPN_CONFIG }}"
          check_secret "NGROK_AUTHTOKEN" "${{ secrets.NGROK_AUTHTOKEN }}"
          check_secret "NGROK_DOMAIN" "${{ secrets.NGROK_DOMAIN }}"
          check_secret "GH_TOKEN" "${{ secrets.GH_TOKEN }}"

          if [ "$MISSING" -eq 1 ]; then
            echo "==============================="
            echo "❌ One or more required secrets are missing. Aborting before any VPN/ngrok work begins."
            echo "==============================="
            exit 1
          fi

          echo "==============================="
          echo "✅ All required secrets are present."
          echo "==============================="

      - name: Install OpenVPN
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR ❌❌❌"; echo "Step: Install OpenVPN"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"' ERR

          echo "==============================="
          echo "--- Updating apt package lists ---"
          if ! sudo apt-get update; then
            echo "❌ apt-get update failed"
            exit 1
          fi
          echo "✅ apt-get update succeeded"

          echo "--- Installing openvpn package ---"
          if ! sudo apt-get install -y openvpn; then
            echo "❌ apt-get install openvpn failed"
            exit 1
          fi
          echo "✅ openvpn package installed"

          echo "--- OpenVPN Version ---"
          openvpn --version
          echo "==============================="

      - name: Setup VPN Credentials
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR ❌❌❌"; echo "Step: Setup VPN Credentials"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"' ERR

          echo "--- Creating credentials file ---"
          echo "${{ secrets.VPN_USERNAME }}" > pass.txt
          echo "${{ secrets.VPN_PASSWORD }}" >> pass.txt
          chmod 600 pass.txt

          if [ ! -s pass.txt ]; then
            echo "❌ pass.txt is empty after creation — VPN_USERNAME/VPN_PASSWORD secrets may be blank"
            exit 1
          fi
          echo "✅ pass.txt created ($(wc -l < pass.txt) lines)"

          echo "--- Writing VPN config ---"
          echo "${{ secrets.VPN_CONFIG }}" > config.ovpn

          if [ ! -s config.ovpn ]; then
            echo "❌ config.ovpn is empty after creation — VPN_CONFIG secret may be blank"
            exit 1
          fi
          echo "✅ config.ovpn created ($(wc -l < config.ovpn) lines)"

          echo "--- Removing deprecated options ---"
          sed -i '/persist-key/d' config.ovpn
          sed -i '/persist-tun/d' config.ovpn
          echo "✅ Removed persist-key and persist-tun"

          echo "--- Fixing auth-user-pass line ---"
          sed -i '/auth-user-pass/d' config.ovpn
          echo "auth-user-pass pass.txt" >> config.ovpn
          echo "✅ auth-user-pass fixed"

          echo "--- Fixing cipher negotiation (OpenVPN 2.6+ requirement) ---"
          echo "data-ciphers AES-128-CBC" >> config.ovpn
          echo "data-ciphers-fallback AES-128-CBC" >> config.ovpn
          echo "✅ data-ciphers added"

          echo "==============================="
          echo "--- Final config.ovpn content ---"
          cat config.ovpn
          echo "==============================="

      - name: Check IP Before VPN
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR ❌❌❌"; echo "Step: Check IP Before VPN"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"' ERR

          echo "==============================="
          echo "GitHub Runner IP (Before VPN):"
          set +e
          BEFORE_IP=$(curl -s --connect-timeout 10 --max-time 20 https://ifconfig.me 2>/tmp/before_ip_err.log)
          BEFORE_EXIT=$?
          set -e
          if [ $BEFORE_EXIT -ne 0 ]; then
            echo "⚠️ ifconfig.me unreachable (non-fatal) — curl exit code $BEFORE_EXIT"
            echo "⚠️ curl stderr: $(cat /tmp/before_ip_err.log 2>/dev/null)"
          else
            echo "$BEFORE_IP"
          fi
          echo "==============================="

      - name: Start VPN
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR ❌❌❌"; echo "Step: Start VPN"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"' ERR

          echo "--- Enabling TUN device ---"
          sudo modprobe tun
          ls /dev/net/tun
          echo "✅ TUN device is available"

          echo "--- Creating log file with open permissions ---"
          sudo touch /tmp/vpn.log
          sudo chmod 777 /tmp/vpn.log
          echo "✅ Log file created"

          echo "--- Starting OpenVPN ---"
          sudo openvpn \
            --config config.ovpn \
            --auth-user-pass pass.txt \
            --verb 6 \
            --log /tmp/vpn.log &

          VPN_PID=$!
          echo "✅ OpenVPN PID: $VPN_PID"

          echo "--- Waiting up to 60 seconds for tun0 to appear ---"
          TUN_UP=0
          for i in {1..60}; do
            sleep 1
            if ip link show tun0 > /dev/null 2>&1; then
              echo "✅ tun0 appeared at second $i"
              TUN_UP=1
              break
            fi
            echo "⏳ Second $i - waiting for tun0..."
          done

          echo "==============================="
          echo "--- Full VPN Log ---"
          sudo cat /tmp/vpn.log
          echo "==============================="

          if [ "$TUN_UP" -eq 0 ]; then
            echo "❌ tun0 NEVER appeared within 60 seconds - VPN failed to connect"
            echo "--- Process list (openvpn) ---"
            ps aux | grep openvpn || true
            exit 1
          fi
          echo "✅ tun0 is UP"

          echo "--- Checking OpenVPN process ---"
          if pgrep openvpn > /dev/null; then
            echo "✅ OpenVPN process is RUNNING"
          else
            echo "❌ OpenVPN process DIED after tun0 came up (unusual)"
            exit 1
          fi

      - name: Verify VPN Connection
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR ❌❌❌"; echo "Step: Verify VPN Connection"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"' ERR

          echo "==============================="
          echo "Exit IP (After VPN):"
          set +e
          CURRENT_IP=$(curl -s --connect-timeout 10 --max-time 20 https://ifconfig.me 2>/tmp/after_ip_err.log)
          IP_EXIT=$?
          set -e
          if [ $IP_EXIT -ne 0 ]; then
            echo "⚠️ ifconfig.me check failed — curl exit code $IP_EXIT: $(cat /tmp/after_ip_err.log 2>/dev/null)"
            CURRENT_IP="UNKNOWN"
          else
            echo "$CURRENT_IP"
          fi
          echo ""

          echo "==============================="
          echo "Location Details:"
          if [ "$CURRENT_IP" != "UNKNOWN" ]; then
            set +e
            curl -s --connect-timeout 10 --max-time 20 https://ipinfo.io/$CURRENT_IP 2>/tmp/ipinfo_err.log
            IPINFO_EXIT=$?
            set -e
            if [ $IPINFO_EXIT -ne 0 ]; then
              echo "⚠️ ipinfo.io unreachable (non-fatal) — curl exit code $IPINFO_EXIT: $(cat /tmp/ipinfo_err.log 2>/dev/null)"
            fi
          else
            echo "⚠️ Skipping ipinfo.io lookup — IP unknown"
          fi
          echo ""

          echo "==============================="
          echo "VPN Tunnel Interface (tun0):"
          if ip addr show tun0 > /dev/null 2>&1; then
            ip addr show tun0
            echo "✅ tun0 is UP"
          else
            echo "❌ tun0 is NOT found"
            exit 1
          fi

          echo "==============================="
          echo "Routing Table:"
          ip route
          echo ""

          echo "==============================="
          echo "DNS Check:"
          cat /etc/resolv.conf
          echo ""

          echo "==============================="
          echo "--- Full VPN Log After Connection ---"
          sudo cat /tmp/vpn.log
          echo "==============================="

      - name: Start Receiver
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR ❌❌❌"; echo "Step: Start Receiver"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"' ERR

          echo "==============================="
          echo "--- Checking python3 availability ---"
          python3 --version
          echo "==============================="

          echo "--- Starting receiver.py (unbuffered) on port 8081 ---"
          nohup python3 -u receiver.py > /tmp/receiver.log 2>&1 &
          RECEIVER_PID=$!
          echo "✅ Receiver PID: $RECEIVER_PID"

          sleep 5

          echo "--- Checking if port 8081 is listening ---"
          sudo ss -tlnp | grep 8081 || echo "⚠️ Port 8081 not found in ss output (non-fatal, will verify with curl next)"

          echo "--- Receiver Log (first 5 seconds) ---"
          cat /tmp/receiver.log
          echo "==============================="

          echo "--- Checking receiver process is alive ---"
          if ! pgrep -f receiver.py > /dev/null; then
            echo "❌ receiver.py process is NOT running"
            cat /tmp/receiver.log
            exit 1
          fi
          echo "✅ receiver.py process is alive"

          echo "--- Testing receiver with curl ---"
          set +e
          HTTP_CODE=$(curl -s -o /tmp/curl_response.txt -w "%{http_code}" --connect-timeout 5 --max-time 10 http://localhost:8081/ 2>/tmp/receiver_curl_err.log)
          CURL_EXIT=$?
          set -e

          if [ $CURL_EXIT -ne 0 ]; then
            echo "❌ curl itself failed (exit code $CURL_EXIT): $(cat /tmp/receiver_curl_err.log 2>/dev/null)"
            cat /tmp/receiver.log
            exit 1
          fi

          echo "HTTP response code: $HTTP_CODE"
          echo "--- Response body ---"
          cat /tmp/curl_response.txt 2>/dev/null || echo "(no response body captured)"
          echo ""
          echo "==============================="

          if [ "$HTTP_CODE" == "000" ]; then
            echo "❌ Receiver is NOT reachable at all (connection failed)"
            cat /tmp/receiver.log
            exit 1
          else
            echo "✅ Receiver responded with HTTP $HTTP_CODE (server is up)"
          fi

      - name: Start Ngrok Tunnel
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR ❌❌❌"; echo "Step: Start Ngrok Tunnel"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"' ERR

          echo "==============================="
          echo "--- Attempt 1: Downloading ngrok binary from official bin.ngrok.com mirror ---"
          DOWNLOAD_OK=0
          if curl -fsSL --connect-timeout 15 --max-time 180 --retry 3 --retry-delay 5 --retry-all-errors \
            https://bin.ngrok.com/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o /tmp/ngrok.tgz; then
            SIZE=$(stat -c%s /tmp/ngrok.tgz 2>/dev/null || echo "0")
            if [ "$SIZE" -gt 1000000 ]; then
              echo "✅ Downloaded successfully from bin.ngrok.com (${SIZE} bytes)"
              DOWNLOAD_OK=1
            else
              echo "⚠️ File downloaded but suspiciously small (${SIZE} bytes) — treating as failed"
            fi
          else
            echo "⚠️ bin.ngrok.com download failed or timed out"
          fi

          if [ "$DOWNLOAD_OK" -eq 0 ]; then
            echo "==============================="
            echo "--- Attempt 2: Fallback — installing ngrok via apt repository ---"
            if curl -sSL --connect-timeout 15 --max-time 30 https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null; then
              echo "✅ ngrok GPG key added"
              echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" | sudo tee /etc/apt/sources.list.d/ngrok.list >/dev/null
              if sudo apt-get update && sudo apt-get install -y ngrok; then
                echo "✅ ngrok installed via apt fallback"
                DOWNLOAD_OK=1
              else
                echo "❌ apt-based ngrok install also failed"
              fi
            else
              echo "❌ Could not fetch ngrok GPG key for apt fallback"
            fi
          else
            echo "--- Extracting ngrok binary to /usr/local/bin ---"
            if ! sudo tar -xzf /tmp/ngrok.tgz -C /usr/local/bin; then
              echo "❌ Failed to extract ngrok binary"
              exit 1
            fi
            echo "✅ ngrok binary extracted"
          fi

          if [ "$DOWNLOAD_OK" -eq 0 ]; then
            echo "❌ Both download methods failed — cannot proceed"
            exit 1
          fi

          echo "--- Verifying ngrok binary ---"
          if ! ngrok version; then
            echo "❌ ngrok binary not working"
            exit 1
          fi
          echo "✅ ngrok installed and verified"

          echo "--- Configuring ngrok authtoken ---"
          if ! ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}; then
            echo "❌ Failed to configure ngrok authtoken"
            exit 1
          fi
          echo "✅ authtoken configured"

          echo "--- Starting ngrok tunnel on static domain ---"
          nohup ngrok http 8081 --url=${{ secrets.NGROK_DOMAIN }} > /tmp/ngrok.log 2>&1 &
          NGROK_PID=$!
          echo "✅ ngrok PID: $NGROK_PID"

          sleep 8

          echo "--- Ngrok Log ---"
          cat /tmp/ngrok.log
          echo "==============================="

          if ! pgrep ngrok > /dev/null; then
            echo "❌ ngrok process is NOT running after startup"
            cat /tmp/ngrok.log
            exit 1
          fi
          echo "✅ ngrok process is alive"

          echo "--- Ngrok Tunnel Status (API) ---"
          set +e
          curl -s --connect-timeout 5 --max-time 10 http://localhost:4040/api/tunnels
          set -e
          echo ""
          echo "==============================="

          echo "✅ Binance Receiver URL: https://${{ secrets.NGROK_DOMAIN }}"
          echo "==============================="

          echo "--- Verifying public URL responds ---"
          set +e
          PUBLIC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 15 https://${{ secrets.NGROK_DOMAIN }}/ 2>/tmp/public_url_err.log)
          PUBLIC_EXIT=$?
          set -e

          if [ $PUBLIC_EXIT -ne 0 ]; then
            echo "❌ curl to public ngrok URL failed — exit code $PUBLIC_EXIT: $(cat /tmp/public_url_err.log 2>/dev/null)"
            cat /tmp/ngrok.log
            exit 1
          fi

          echo "Public URL responded with status: $PUBLIC_STATUS"
          if [ "$PUBLIC_STATUS" == "000" ]; then
            echo "❌ Ngrok tunnel is NOT reachable publicly"
            cat /tmp/ngrok.log
            exit 1
          else
            echo "✅ Ngrok tunnel is publicly reachable"
          fi

      - name: Run Task and Ping Pong Loop
        run: |
          set -Eeuo pipefail
          trap 'echo "❌❌❌ FATAL ERROR (uncaught) ❌❌❌"; echo "Step: Run Task and Ping Pong Loop"; echo "Line: $LINENO"; echo "Command: $BASH_COMMAND"; echo "Exit code: $?"; echo "Timestamp (UTC): $(date -u +"%Y-%m-%dT%H:%M:%SZ")"' ERR

          DURATION_MINUTES=120

          echo "==============================="
          echo "✅ VPN is ACTIVE"
          echo "✅ Receiver is ACTIVE on port 8081"
          echo "✅ Ngrok tunnel is ACTIVE at https://${{ secrets.NGROK_DOMAIN }}"
          echo "⏱ Running for ${DURATION_MINUTES} minutes then handing off to Relay workflow..."
          echo "==============================="
          echo "ℹ️ curl exit code reference: 6=DNS resolve failure, 7=connection refused, 28=timeout, 35=SSL error, 52=empty reply, 56=network receive error"
          echo "==============================="

          trigger_relay() {
            echo "==============================="
            echo "🔄 Triggering Relay workflow (relay_ping)..."
            set +e
            curl -s -X POST --connect-timeout 10 --max-time 15 \
              -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/dispatches \
              -d '{"event_type": "relay_ping"}'
            RELAY_EXIT=$?
            set -e
            if [ $RELAY_EXIT -ne 0 ]; then
              echo "⚠️ Relay trigger curl failed — exit code $RELAY_EXIT (non-fatal, chain may need manual restart)"
            else
              echo ""
              echo "✅ Relay workflow trigger attempted!"
            fi
            echo "==============================="
          }

          FAILURE=0

          for i in $(seq 1 $DURATION_MINUTES); do
            set +e
            CURRENT_IP=$(curl -s --connect-timeout 5 --max-time 10 https://ifconfig.me 2>/tmp/loop_ip_err.log)
            IP_EXIT=$?
            set -e

            if [ $IP_EXIT -ne 0 ]; then
              CURRENT_IP="UNKNOWN(curl_exit=$IP_EXIT)"
              echo "⚠️ [Minute $i] IP check curl failed — exit code $IP_EXIT: $(cat /tmp/loop_ip_err.log 2>/dev/null)"
            fi

            if pgrep openvpn > /dev/null; then
              VPN_STATUS="ACTIVE"
            else
              VPN_STATUS="DEAD"
            fi

            if pgrep -f receiver.py > /dev/null; then
              RECEIVER_STATUS="ACTIVE"
            else
              RECEIVER_STATUS="DEAD"
            fi

            if pgrep ngrok > /dev/null; then
              NGROK_STATUS="ACTIVE"
            else
              NGROK_STATUS="DEAD"
            fi

            echo "✅ [$(date -u +"%H:%M:%S")] Minute $i/$DURATION_MINUTES | VPN: $VPN_STATUS | Receiver: $RECEIVER_STATUS | Ngrok: $NGROK_STATUS | IP: $CURRENT_IP"

            if [ "$VPN_STATUS" == "DEAD" ] || [ "$RECEIVER_STATUS" == "DEAD" ] || [ "$NGROK_STATUS" == "DEAD" ]; then
              echo "❌ Something died at minute $i. Dumping logs..."
              echo "--- VPN Log ---"
              sudo cat /tmp/vpn.log || echo "⚠️ could not read vpn.log"
              echo "--- Receiver Log ---"
              cat /tmp/receiver.log || echo "⚠️ could not read receiver.log"
              echo "--- Ngrok Log ---"
              cat /tmp/ngrok.log || echo "⚠️ could not read ngrok.log"
              echo "🔄 Triggering emergency relay before exiting to keep chain alive..."
              trigger_relay
              FAILURE=1
              break
            fi

            sleep 60
          done

          if [ "$FAILURE" == "1" ]; then
            echo "==============================="
            echo "❌ Workflow A exiting with FAILURE status (component died early at minute $i)"
            echo "✅ Chain preserved — Relay workflow was already triggered before exit"
            echo "==============================="
            exit 1
          else
            echo "==============================="
            echo "⏱ ${DURATION_MINUTES} minutes reached — normal handoff."
            echo "==============================="
            trigger_relay
            echo "🏓 Workflow A complete — Workflow B now running."
            echo "==============================="
          fi
